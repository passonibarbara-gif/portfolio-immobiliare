        ${alertProprietario.controlloInRitardo>0 ? `<div class="alert-banner-item clickable" data-goto-owner-alert="controlli">Controllo periodico in ritardo</div>` : ''}
      </div>
    ` : '';
    ownerTabContent = `
      ${alertBannerProprietario}
      <div class="dash-hero">
        <div class="dash-hero-title">${state.settings.nomeAgenzia||'La tua agenzia'}</div>
        <div class="dash-grid">
          <div class="dash-item" ${alertProprietario.totale>0 ? `data-goto-owner-alert="${alertProprietario.preventiviInAttesa>0?'interventi':alertProprietario.speseInAttesa>0?'spese':'controlli'}" style="cursor:pointer;"` : ''}><div class="dash-label">Stato</div><div class="dash-value ${(d.preventiviInAttesa>0||d.controlloInRitardo)?'warn':''}" style="font-size:15px;${alertProprietario.totale>0?'text-decoration:underline;':''}">${d.stato}</div></div>
          <div class="dash-item"><div class="dash-label">Occupazione mese</div><div class="dash-value">${d.occupazione!==null?d.occupazione+'%':'—'}</div></div>
          <div class="dash-item"><div class="dash-label">Ricavi mese</div><div class="dash-value">${fmtCurrency(d.ricaviMese)}</div></div>
          <div class="dash-item"><div class="dash-label">Prossimo soggiorno</div><div class="dash-value" style="font-size:15px;">${d.prossimoSoggiorno?fmtDate(d.prossimoSoggiorno):'Nessuno'}</div></div>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
        ${waButton(state.settings.telefonoGestore, `Salve, sono il proprietario di ${p.nome}, avrei bisogno di parlare con voi.`, "Contatta l'agenzia su WhatsApp")}
        <button class="icon-btn" data-action="scarica-report"><i class="ti ti-download"></i> Scarica report</button>
      </div>
      ${renderImpegnoServizio()}
      <p class="section-label" style="margin-top:24px;">Contratto di gestione</p>
      ${renderContrattoGestione(p)}
    `;
  } else if(ownerTab==='foto'){
    ownerTabContent = `
      ${renderPhotoGallery(fotoPubbliche(p))}
      <p class="section-label" style="margin-top:20px;">Foto di gestione &nbsp;·&nbsp; prova degli interventi eseguiti</p>
      ${renderFotoCardsSoloLettura(fotoGestione(p))}
    `;
  } else if(ownerTab==='prenotazioni'){
    ownerTabContent = p.disponibilePrenotazioni ? `
      ${renderCalendar(p.prenotazioni, state.calendarOffset)}
      <table style="margin-top:16px;"><thead><tr><th>Ospite</th><th>Date</th><th>Stato</th></tr></thead><tbody>${bookingRows}</tbody></table>
    ` : `<div class="empty-inline">Questo immobile non è attualmente disponibile per prenotazioni brevi.</div>`;
  } else if(ownerTab==='interventi'){
    ownerTabContent = `
      ${renderInterventions(p, 'proprietario')}
      <button class="add-inline" data-action="new-segnalazione">+ Segnala un problema</button>
    `;
  } else if(ownerTab==='controlli'){
    ownerTabContent = `
      ${renderRiepilogoControlli(p, false)}
      ${renderControlli(p, false)}
    `;
  } else if(ownerTab==='spese'){
    ownerTabContent = `
      <p class="section-label">Spese</p>
      ${renderSpese(p, 'proprietario')}

      <p class="section-label">Il tuo guadagno</p>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">Ricavi totali</div><div class="stat-value">${fmtCurrency(g.ricaviTotali)}</div></div>
        <div class="stat-card"><div class="stat-label">Percentuale riconosciuta</div><div class="stat-value">${g.percentuale}%</div></div>
        <div class="stat-card"><div class="stat-label">Guadagno maturato</div><div class="stat-value sage">${fmtCurrency(g.guadagnoMaturato)}</div></div>
      </div>

      <p class="section-label">Pagamenti</p>
      <div class="stat-row">
        <div class="stat-card"><div class="stat-label">Già ricevuto</div><div class="stat-value">${fmtCurrency(g.versato)}</div></div>
        <div class="stat-card"><div class="stat-label">In sospeso</div><div class="stat-value ${g.saldoInSospeso>0?'terracotta':'sage'}">${fmtCurrency(g.saldoInSospeso)}</div></div>
      </div>
      ${g.saldoInSospeso>0 ? `<p style="font-size:12.5px;color:var(--terracotta);margin:-10px 0 20px 0;">Hai un saldo da ricevere dall'agenzia.</p>` : ''}
    `;
  } else if(ownerTab==='messaggi'){
    ownerTabContent = renderMessages(p, 'proprietario');
  }

  return `<div class="portal-shell" style="max-width:760px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
      ${mieiImmobili.length>1 ? `<button class="link-btn" data-owner-back>← I miei immobili</button>` : `<span></span>`}
      <button class="link-btn" data-owner-logout>Esci</button>
    </div>
    <h1 class="page-title">${propertyTypeIcon(p.tipo)}${p.nome}</h1>
    <p class="page-sub">${p.indirizzo||'—'} · ${p.tipo}</p>

    <div class="dossier-tabs">${ownerTabsHtml}</div>
    ${ownerTabContent}
  </div>`;
}

// ---------- Vista Prenota un soggiorno ----------
function renderGestisciPrenotazione(){
  if(!state.guestManagePhone){
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-manage-exit style="margin-bottom:16px;">← Torna alla prenotazione</button>
      <h1 class="page-title">Gestisci la tua prenotazione</h1>
      <p class="page-sub">Inserisci il numero di telefono che hai usato per prenotare.</p>
      <form id="guestLookupForm" style="max-width:320px;">
        <div class="field"><label>Telefono</label><input name="telefono" required placeholder="+39..."></div>
        <button type="submit" class="btn-primary" style="width:100%;">Cerca</button>
      </form>
    </div>`;
  }

  const risultati = [];
  state.properties.forEach(p=>{
    (p.prenotazioni||[]).forEach(b=>{
      if(b.telefono === state.guestManagePhone) risultati.push({p, b});
    });
  });

  if(!risultati.length){
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-manage-reset style="margin-bottom:16px;">← Cerca un altro numero</button>
      <h1 class="page-title">Nessuna prenotazione trovata</h1>
      <p class="page-sub">Controlla di aver inserito lo stesso numero usato in fase di prenotazione.</p>
    </div>`;
  }

  let selezionata = state.guestManageSelected;
  if(!selezionata && risultati.length===1){
    selezionata = {propId: risultati[0].p.id, bookingId: risultati[0].b.id};
    state.guestManageSelected = selezionata;
  }

  if(!selezionata){
    const cards = risultati.map(r=>`
      <div class="portal-pick-card" data-guest-manage-pick="${r.p.id}::${r.b.id}">
        <div><div style="font-family:'Fraunces',serif;font-weight:600;">${r.p.nome}</div><div style="font-size:12px;color:var(--ink-soft);">${fmtDate(r.b.checkin)} → ${fmtDate(r.b.checkout)} · ${r.b.stato}</div></div>
        <span style="color:var(--ink-soft);">→</span>
      </div>`).join('');
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-manage-reset style="margin-bottom:16px;">← Cerca un altro numero</button>
      <h1 class="page-title">Le tue prenotazioni</h1>
      <div class="portal-picker">${cards}</div>
    </div>`;
  }

  const p = state.properties.find(x=>x.id===selezionata.propId);
  const b = p && (p.prenotazioni||[]).find(x=>x.id===selezionata.bookingId);
  if(!p || !b){ state.guestManageSelected = null; return renderGestisciPrenotazione(); }

  const statoLabel = {richiesta:'In attesa di conferma', confermata:'Confermata', rifiutata:'Rifiutata'}[b.stato] || b.stato;
  const statoColore = b.stato==='confermata' ? 'sage' : b.stato==='rifiutata' ? 'terracotta' : '';

  return `<div class="portal-shell" style="max-width:760px;">
    <button class="link-btn" ${risultati.length>1 ? 'data-guest-manage-deselect' : 'data-guest-manage-reset'} style="margin-bottom:16px;">← ${risultati.length>1 ? 'Le tue prenotazioni' : 'Cerca un altro numero'}</button>
    <h1 class="page-title">${propertyTypeIcon(p.tipo)}${p.nome}</h1>
    <p class="page-sub">${fmtDate(b.checkin)} → ${fmtDate(b.checkout)}</p>

    <div class="chart-card">
      <div style="display:flex;gap:14px;flex-wrap:wrap;">
        <div class="stat-card" style="flex:1;min-width:140px;"><div class="stat-label">Stato</div><div class="stat-value ${statoColore}" style="font-size:17px;">${statoLabel}</div></div>
        ${b.totale ? `<div class="stat-card" style="flex:1;min-width:140px;"><div class="stat-label">Totale</div><div class="stat-value" style="background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;">${fmtCurrency(b.totale)}</div></div>` : ''}
      </div>
      ${b.pagamentoRicevuto
        ? `<p style="color:var(--sage);font-size:13.5px;font-weight:500;margin:16px 0 0 0;"><span class="seal">✓</span>Pagamento ricevuto</p>`
        : (p.linkPagamento && b.totale && b.stato==='confermata'
            ? `<a class="btn-primary" href="${p.linkPagamento}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;margin-top:16px;">Paga ora</a>`
            : '')}
    </div>

    <p class="section-label" style="margin-top:24px;">Messaggi con l'agenzia</p>
    ${renderBookingChat(p, b, 'ospite')}
  </div>`;
}

function renderOspitiView(){
  if(state.guestManageMode) return renderGestisciPrenotazione();

  if(state.guestSubmitted && state.lastBooking){
    const b = state.lastBooking;
    return `<div class="portal-shell" style="text-align:center;">
      <div class="guest-confirm-mark"><i class="ti ti-check"></i></div>
      <h1 class="page-title">Richiesta inviata</h1>
      <p class="page-sub">Ti contatteremo a breve per confermare la prenotazione presso ${b.propNome}.</p>
      ${b.totale ? `<p style="font-size:15px;margin-bottom:18px;">Totale soggiorno: <strong>${fmtCurrency(b.totale)}</strong></p>` : ''}
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px;">
        ${b.linkPagamento ? `<a class="btn-primary" href="${b.linkPagamento}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block;">Paga ora</a>` : ''}
        ${waButton(state.settings.telefonoGestore, `Ciao! Ho inviato una richiesta di prenotazione per ${b.propNome} dal ${b.checkin} al ${b.checkout}. Sono ${b.nome}.`, 'Scrivici su WhatsApp per accelerare')}
      </div>
      <p style="font-size:12.5px;color:var(--ink-soft);">Potrai seguire lo stato e la ricevuta di pagamento da "Gestisci la tua prenotazione", inserendo il numero di telefono usato ora.</p>
      <br>
      <button class="btn-secondary" data-guest-restart>Fai un'altra richiesta</button>
    </div>`;
  }

  const step = state.guestWizardStep || 1;

  // ---- Step 1: scelta periodo ----
  if(step===1){
    return `<div class="portal-shell" style="max-width:760px;">
      <div class="guest-hero">
        <div class="guest-hero-brand">${state.settings.nomeAgenzia || 'Property Manager'}</div>
        <h1>Trova il tuo prossimo soggiorno</h1>
        <p>Scegli le date, controlla la disponibilità in tempo reale e prenota in pochi minuti.</p>
      </div>
      <button class="link-btn" data-guest-goto-manage style="margin-bottom:20px;display:block;">Hai già prenotato? Gestisci la tua prenotazione →</button>
      ${renderWizardSteps(1)}
      <form id="guestDatesForm" style="max-width:420px;">
        <div class="field-row">
          <div class="field"><label>Check-in</label><input type="date" name="checkin" required value="${state.guestDates.checkin}"></div>
          <div class="field"><label>Check-out</label><input type="date" name="checkout" required value="${state.guestDates.checkout}"></div>
        </div>
        <div class="field-row">
          <div class="field"><label>Adulti</label><input type="number" name="adulti" min="1" required value="${state.guestDates.adulti||1}"></div>
          <div class="field"><label>Bambini</label><input type="number" name="bambini" min="0" value="${state.guestDates.bambini||0}"></div>
        </div>
        <div class="field"><label>Animali domestici al seguito</label><input type="number" name="animali" min="0" value="${state.guestDates.animali||0}"></div>
        <button type="submit" class="btn-primary" style="width:100%;margin-top:8px;">Cerca immobili disponibili</button>
      </form>
    </div>`;
  }

  // ---- Step 2: immobili disponibili ----
  if(step===2){
    const gd = state.guestDates;
    const bookable = state.properties.filter(p=>propertyAvailableForDates(p, gd.checkin, gd.checkout, gd.adulti, gd.bambini, gd.animali));
    const cards = bookable.map(p=>{
      const cop = getCoverPhotoPubblicaUrl(p);
      const calcolo = calcTotale(p, gd.checkin, gd.checkout);
      const caratteristiche = [
        (p.capacitaAdulti||p.capacitaBambini) ? `<i class="ti ti-user"></i> fino a ${p.capacitaAdulti||0} adult${p.capacitaAdulti===1?'o':'i'}${p.capacitaBambini?` + ${p.capacitaBambini} bambin${p.capacitaBambini===1?'o':'i'}`:''}` : null,
        p.animaliAmmessi ? '<i class="ti ti-dog"></i> animali ammessi' : null
      ].filter(Boolean).join(' · ');
      return `<div class="guest-prop-card" data-guest-pick="${p.id}">
        ${cop ? `<img class="guest-prop-card-img" src="${cop}">` : `<div class="guest-prop-card-img placeholder">${propertyTypeIcon(p.tipo)}</div>`}
        <div class="guest-prop-card-body">
          <div class="guest-prop-card-name">${p.nome}</div>
          <div class="guest-prop-card-addr">${p.indirizzo||'—'} · ${p.tipo}</div>
          ${caratteristiche ? `<div class="guest-prop-card-feat">${caratteristiche}</div>` : ''}
          <div class="guest-prop-card-foot">
            <span class="guest-prop-card-price">${fmtCurrency(calcolo.totale)}</span>
            <span class="guest-prop-card-nights">${calcolo.notti} nott${calcolo.notti===1?'e':'i'}</span>
          </div>
        </div>
      </div>`;
    }).join('') || '<p style="color:var(--ink-soft);">Nessun immobile disponibile per queste date e per il numero di ospiti/animali indicato. Prova a cambiare i criteri.</p>';

    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-wizard-back="1" style="margin-bottom:16px;">← Cambia criteri</button>
      ${renderWizardSteps(2)}
      <h1 class="page-title">Immobili disponibili</h1>
      <p class="page-sub">${fmtDate(gd.checkin)} → ${fmtDate(gd.checkout)} · ${gd.adulti} adult${gd.adulti===1?'o':'i'}${gd.bambini?`, ${gd.bambini} bambin${gd.bambini===1?'o':'i'}`:''}${gd.animali?`, ${gd.animali} animal${gd.animali===1?'e':'i'}`:''}</p>
      <div class="guest-prop-grid">${cards}</div>
    </div>`;
  }

  const p = state.properties.find(x=>x.id===state.guestPropId);
  if(!p){ state.guestWizardStep = 2; return renderOspitiView(); }
  const calcolo = calcTotale(p, state.guestDates.checkin, state.guestDates.checkout);

  // ---- Step 3: dettagli immobile e importo ----
  if(step===3){
    const righeServizi = calcolo.servizi.map(s=>`<tr><td>${s.nome}</td><td class="cell-num">${fmtCurrency(s.importo)}</td></tr>`).join('');
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-wizard-back="2" style="margin-bottom:16px;">← Altri immobili</button>
      ${renderWizardSteps(3)}
      <h1 class="page-title">${propertyTypeIcon(p.tipo)}${p.nome}</h1>
      <p class="page-sub">${p.indirizzo||'—'} · ${p.tipo}</p>
      ${renderPhotoGallery(fotoPubbliche(p))}
      <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;">
        ${(p.capacitaAdulti||p.capacitaBambini) ? `<span><i class="ti ti-user"></i> Fino a ${p.capacitaAdulti||0} adult${p.capacitaAdulti===1?'o':'i'}${p.capacitaBambini?` + ${p.capacitaBambini} bambin${p.capacitaBambini===1?'o':'i'}`:''}</span>` : ''}
        <span>${p.animaliAmmessi ? '<i class="ti ti-dog"></i> Animali ammessi' : '<i class="ti ti-ban"></i> Animali non ammessi'}</span>
      </div>
      ${renderCaratteristicheAnnuncio(p)}
      <div class="chart-card">
        <p class="section-label" style="margin-top:0;">Il tuo soggiorno</p>
        <table>
          <tbody>
            <tr><td>${fmtDate(state.guestDates.checkin)} → ${fmtDate(state.guestDates.checkout)} (${calcolo.notti} nott${calcolo.notti===1?'e':'i'})</td><td class="cell-num">${fmtCurrency(calcolo.soggiornoBase)}</td></tr>
            ${righeServizi}
          </tbody>
        </table>
        <div class="chart-total" style="margin-top:6px;">Totale: <span style="background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;">${fmtCurrency(calcolo.totale)}</span></div>
      </div>
      <button class="btn-primary" data-guest-wizard-next="4" style="width:100%;">Prenota questo immobile</button>
    </div>`;
  }

  // ---- Step 4: dati anagrafici e documento ----
  if(step===4){
    const bd = state.guestBookingData;
    return `<div class="portal-shell" style="max-width:760px;">
      <button class="link-btn" data-guest-wizard-back="3" style="margin-bottom:16px;">← Torna ai dettagli</button>
      ${renderWizardSteps(4)}
      <h1 class="page-title">I tuoi dati</h1>
      <p class="page-sub">Servono per completare la prenotazione.</p>
      <form id="guestDataForm">
        <div class="field-row">
          <div class="field"><label>Nome</label><input name="nomeProprio" required value="${bd.nomeProprio||''}"></div>
          <div class="field"><label>Cognome</label><input name="cognome" required value="${bd.cognome||''}"></div>
        </div>
        <div class="field"><label>Telefono</label><input name="telefono" required value="${bd.telefono||''}" placeholder="+39..."></div>
        <div class="field"><label>Indirizzo di residenza</label><input name="indirizzo" required value="${bd.indirizzo||''}" placeholder="Via, città, provincia"></div>
        <p style="font-size:12px;color:var(--ink-soft);margin:-6px 0 14px 0;">${state.guestDates.adulti} adult${state.guestDates.adulti===1?'o':'i'}${state.guestDates.bambini?`, ${state.guestDates.bambini} bambin${state.guestDates.bambini===1?'o':'i'}`:''}${state.guestDates.animali?`, ${state.guestDates.animali} animal${state.guestDates.animali===1?'e':'i'}`:''} · <button type="button" class="link-btn" data-guest-wizard-back="1" style="font-size:12px;">modifica</button></p>
        <div class="field"><label>Note (facoltativo)</label><input name="note" value="${bd.note||''}" placeholder="Richieste particolari"></div>
        <div class="field"><label>Copia del documento d'identità</label><input type="file" name="documento" accept="image/*" ${bd.documento?'':'required'}></div>
        ${bd.documento ? `<p style="font-size:11px;color:var(--sage);margin:-10px 0 14px 0;">✓ Documento già caricato — ricaricalo solo se vuoi sostituirlo.</p>` : `<p style="font-size:11px;color:var(--ink-soft);margin:-10px 0 14px 0;">Richiesto per la registrazione degli ospiti, come da normativa.</p>`}
        <button type="submit" class="btn-primary" style="width:100%;margin-top:8px;">Continua</button>
      </form>
    </div>`;
  }

  // ---- Step 5: pagamento e conferma finale ----
  const bd = state.guestBookingData;
  const haLinkPagamento = !!p.linkPagamento;
  return `<div class="portal-shell" style="max-width:760px;">
    <button class="link-btn" data-guest-wizard-back="4" style="margin-bottom:16px;">← Modifica i tuoi dati</button>
    ${renderWizardSteps(5)}
    <h1 class="page-title">${haLinkPagamento ? 'Pagamento e conferma' : 'Conferma la tua richiesta'}</h1>
    <div class="chart-card" style="margin-bottom:20px;">
      <div style="font-family:'Fraunces',serif;font-weight:600;font-size:17px;margin-bottom:6px;">${p.nome}</div>
      <div style="font-size:13px;color:var(--ink-soft);">${p.indirizzo||'—'} · ${p.tipo}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">${fmtDate(state.guestDates.checkin)} → ${fmtDate(state.guestDates.checkout)} · ${calcolo.notti} nott${calcolo.notti===1?'e':'i'}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">${bd.nomeProprio} ${bd.cognome} · ${bd.telefono}</div>
      <div style="font-size:13px;color:var(--ink-soft);">${bd.indirizzo}</div>
      <div style="font-size:13px;color:var(--ink-soft);margin-top:8px;">${state.guestDates.adulti} adult${state.guestDates.adulti===1?'o':'i'}${state.guestDates.bambini?`, ${state.guestDates.bambini} bambin${state.guestDates.bambini===1?'o':'i'}`:''}${state.guestDates.animali?`, ${state.guestDates.animali} animal${state.guestDates.animali===1?'e':'i'} domestic${state.guestDates.animali===1?'o':'i'}`:''}</div>
      ${bd.note ? `<div style="font-size:13px;color:var(--ink-soft);margin-top:4px;">Nota: ${bd.note}</div>` : ''}
      <div class="chart-total" style="margin-top:14px;">Totale: <span style="background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent;">${fmtCurrency(calcolo.totale)}</span></div>
    </div>
    ${haLinkPagamento ? `
      <ol style="font-size:13px;color:var(--ink-soft);padding-left:18px;margin-bottom:20px;">
        <li style="margin-bottom:6px;">Vai al pagamento e completalo per l'importo indicato sopra.</li>
        <li>Torna qui e premi "Ho pagato, conferma la prenotazione".</li>
      </ol>
      <a class="btn-primary" href="${p.linkPagamento}" target="_blank" rel="noopener" id="guestGoToPayment" style="width:100%;display:block;text-align:center;text-decoration:none;box-sizing:border-box;margin-bottom:10px;">Vai al pagamento</a>
      <button class="btn-secondary" id="guestConfirmSubmit" style="width:100%;">Ho pagato, conferma la prenotazione</button>

    ` : `

function renderNotifBellHtml(pendingVoci, attivita, badgeTotale, gotoAttr, gotoNotificaAttr){
  const pendingHtml = pendingVoci.length
    ? pendingVoci.map(v=>`<div class="notif-item" data-${gotoAttr}="${v.tipo}"><span class="n-dot"></span><span>${v.txt}</span></div>`).join('')
    : '';
  const attivitaHtml = attivita.length
    ? attivita.slice(0,20).map(n=>`
      <div class="notif-item ${n.letto?'':'unread'}" ${n.tab?`data-${gotoNotificaAttr}="${n.propId}::${n.tab}"`:''}>
        <span class="n-dot ${n.letto?'read':''}"></span>
        <span>${n.testo}${n.propNome?` <span style="color:var(--ink-soft);">· ${n.propNome}</span>`:''}<div class="notif-item-sub">${fmtDate(n.data)}</div></span>
      </div>`).join('')
    : '';
  const sezioni = [];
  if(pendingHtml) sezioni.push(`<div class="notif-panel-title">Da fare</div>${pendingHtml}`);
  if(attivitaHtml) sezioni.push(`<div class="notif-panel-title">Attività recenti</div>${attivitaHtml}`);
  const corpo = sezioni.length ? sezioni.join('') : `<div class="notif-empty">Nessuna notifica al momento.</div>`;
  return `
    <div class="notif-wrap">
      <button type="button" class="notif-btn" data-action="toggle-notif" aria-label="Notifiche">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1 1 12 0c0 4 1.5 5.5 1.5 5.5H4.5S6 13 6 9Z"/><path d="M10 18a2 2 0 0 0 4 0"/></svg>
        ${badgeTotale>0?`<span class="notif-badge">${badgeTotale}</span>`:''}
      </button>
      <div class="notif-panel ${state.notifOpen?'show':''}">
        ${corpo}
      </div>
    </div>
  `;
}
function renderNotificheGestore(alert){
  const voci = [
    alert.prenotazioniPendenti>0 ? {tipo:'prenotazioni', txt:`${alert.prenotazioniPendenti} richiest${alert.prenotazioniPendenti>1?'e':'a'} di prenotazione da confermare o rifiutare`} : null,
    alert.spesePagare>0 ? {tipo:'spese', txt:`${alert.spesePagare} spes${alert.spesePagare>1?'e':'a'} approvat${alert.spesePagare>1?'e':'a'} da pagare`} : null,
    alert.controlliRitardo>0 ? {tipo:'controlli', txt:`${alert.controlliRitardo} immobil${alert.controlliRitardo>1?'i':'e'} con controllo periodico in ritardo`} : null,
    alert.preventiviRisposti>0 ? {tipo:'interventi', txt:`${alert.preventiviRisposti} preventiv${alert.preventiviRisposti>1?'i':'o'} con risposta del proprietario da gestire`} : null,
    alert.interventiDaTriage>0 ? {tipo:'interventi-nuovi', txt:`${alert.interventiDaTriage} nuov${alert.interventiDaTriage>1?'i':'o'} intervent${alert.interventiDaTriage>1?'i':'o'} da valutare`} : null,
    alert.messaggiProprietario>0 ? {tipo:'messaggi', txt:`${alert.messaggiProprietario} messagg${alert.messaggiProprietario>1?'i':'io'} dal proprietario non lett${alert.messaggiProprietario>1?'i':'o'}`} : null,
    alert.messaggiOspiti>0 ? {tipo:'messaggi-ospiti', txt:`${alert.messaggiOspiti} messagg${alert.messaggiOspiti>1?'i':'io'} da${alert.messaggiOspiti>1?' ospiti':' un ospite'} non lett${alert.messaggiOspiti>1?'i':'o'}`} : null,
  ].filter(Boolean);
  const attivita = notificheNonLette(state.properties, 'gestore');
  const nonLette = attivita.filter(n=>!n.letto).length;
  return renderNotifBellHtml(voci, attivita, alert.totale + nonLette, 'goto-alert', 'goto-notifica-gestore');
}
function renderNotificheProprietario(mieiImmobili, alertProprietario){
  const voci = [
    alertProprietario.preventiviInAttesa>0 ? {tipo:'interventi', txt:`${alertProprietario.preventiviInAttesa} preventiv${alertProprietario.preventiviInAttesa>1?'i':'o'} in attesa della tua approvazione`} : null,
    alertProprietario.speseInAttesa>0 ? {tipo:'spese', txt:`${alertProprietario.speseInAttesa} spes${alertProprietario.speseInAttesa>1?'e':'a'} in attesa della tua approvazione`} : null,
    alertProprietario.controlloInRitardo>0 ? {tipo:'controlli', txt:'Controllo periodico in ritardo'} : null,
  ].filter(Boolean);
  const attivita = notificheNonLette(mieiImmobili, 'proprietario');
  const nonLette = attivita.filter(n=>!n.letto).length;
  return renderNotifBellHtml(voci, attivita, voci.length + nonLette, 'goto-owner-alert', 'goto-notifica-owner');
}
function renderTopNav(){
  const alert = calcolaAlertPortfolio();
  let ownerBell = '';
  if(state.ownerAuth && state.view==='proprietari'){
    const clienteLoggato = getClienteByEmail(state.ownerAuth.email);
    const mieiImmobili = clienteLoggato ? state.properties.filter(x=>x.clienteId===clienteLoggato.id) : [];
    if(mieiImmobili.length){

  return `<div class="topnav">

    <div class="topnav-tabs">

function animateBentoNumbers(){
  const els = document.querySelectorAll('.bento-value[data-count], .stat-value[data-count]');
  if(!els.length) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  els.forEach(el=>{
    const target = parseFloat(el.getAttribute('data-count'))||0;
    const isCurrency = el.getAttribute('data-format')==='currency';
    if(reduce){ el.textContent = isCurrency ? fmtCurrency(target) : String(target); return; }
    const start = performance.now(), dur = 850;
    function step(ts){
      const p = Math.min(1, (ts-start)/dur);
      const eased = 1 - Math.pow(1-p, 3);
      const val = target*eased;
      el.textContent = isCurrency ? fmtCurrency(val) : Math.round(val);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

    ev.preventDefault();
    const fd = new FormData(guestDataForm);
    const fileInput = guestDataForm.querySelector('input[type=file]');
    let documento = state.guestBookingData.documento;
    if(fileInput && fileInput.files[0]){
      documento = await readAndCompressImage(fileInput.files[0]);
    }
    state.guestBookingData = {
      nomeProprio: fd.get('nomeProprio'), cognome: fd.get('cognome'),
      telefono: fd.get('telefono'), indirizzo: fd.get('indirizzo'),
      note: fd.get('note'), documento
    };
    state.guestWizardStep = 5;
    render();
  });

  const guestConfirmSubmit = document.getElementById('guestConfirmSubmit');
  if(guestConfirmSubmit) guestConfirmSubmit.addEventListener('click', ()=>{
    const bd = state.guestBookingData;
    const gd = state.guestDates;
    const prop = state.properties.find(x=>x.id===state.guestPropId);
    const nomeCompleto = `${bd.nomeProprio||''} ${bd.cognome||''}`.trim();
    submitBooking(state.guestPropId, {
      nome: nomeCompleto, cognome: bd.cognome, telefono: bd.telefono,
      indirizzo: bd.indirizzo,
      checkin: gd.checkin, checkout: gd.checkout,
      note: bd.note, documento: bd.documento,
      adulti: gd.adulti||1, bambini: gd.bambini||0, animali: gd.animali||0,
      dichiaraPagato: !!(prop && prop.linkPagamento)
    });
    state.guestWizardStep = 1;
    state.guestDates = {checkin:'', checkout:'', adulti:1, bambini:0, animali:0};
    state.guestBookingData = {nomeProprio:'', cognome:'', telefono:'', indirizzo:'', note:'', documento:null};
  });

  const guestGotoManage = document.querySelector('[data-guest-goto-manage]');
  if(guestGotoManage) guestGotoManage.addEventListener('click', ()=>{ state.guestManageMode = true; render(); });
  const guestManageExit = document.querySelector('[data-guest-manage-exit]');
  if(guestManageExit) guestManageExit.addEventListener('click', ()=>{ state.guestManageMode = false; state.guestManagePhone = null; state.guestManageSelected = null; render(); });
  const guestManageReset = document.querySelector('[data-guest-manage-reset]');
  if(guestManageReset) guestManageReset.addEventListener('click', ()=>{ state.guestManagePhone = null; state.guestManageSelected = null; render(); });
  const guestManageDeselect = document.querySelector('[data-guest-manage-deselect]');
  if(guestManageDeselect) guestManageDeselect.addEventListener('click', ()=>{ state.guestManageSelected = null; render(); });
  document.querySelectorAll('[data-guest-manage-pick]').forEach(b=>b.addEventListener('click', ()=>{
    const [propId, bookingId] = b.getAttribute('data-guest-manage-pick').split('::');
    state.guestManageSelected = {propId, bookingId};
    render();
  }));

  const guestLookupForm = document.getElementById('guestLookupForm');
  if(guestLookupForm) guestLookupForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(guestLookupForm);
    state.guestManagePhone = (fd.get('telefono')||'').trim();
    state.guestManageSelected = null;
    render();
  });

  document.querySelectorAll('[data-segna-pagamento-booking]').forEach(b=>b.addEventListener('click', ()=>openModal('pagamentoBooking', null, state.selectedId, {bookingId:b.getAttribute('data-segna-pagamento-booking')})));

  document.querySelectorAll('.msg-form-booking').forEach(f=>{
    f.addEventListener('submit', ev=>{
      ev.preventDefault();
      const [propId, bookingId] = f.getAttribute('data-booking-msg-form').split('::');
      const autore = f.getAttribute('data-autore');
      const input = f.querySelector('[name=testo]');
      const testo = input.value.trim();
      if(!testo) return;
      sendMessageBooking(propId, bookingId, autore, testo);
    });
  });

  document.querySelectorAll('.msg-form').forEach(f=>{
    f.addEventListener('submit', ev=>{
      ev.preventDefault();
      const propId = f.getAttribute('data-msg-form');
      const autore = f.getAttribute('data-autore');
      const input = f.querySelector('[name=testo]');
      const testo = input.value.trim();
      if(!testo) return;
      sendMessage(propId, autore, testo);
    });
  });
  document.querySelectorAll('[data-msg-thread]').forEach(el=>{ el.scrollTop = el.scrollHeight; });

  // modal close
  const overlay = document.querySelector('[data-close-overlay]');
  if(overlay){
    overlay.addEventListener('click', (ev)=>{ if(ev.target===overlay) closeModal(); });
    document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
    document.querySelector('[data-stop]')?.addEventListener('click', ev=>ev.stopPropagation());
  }

  const propForm = document.getElementById('propForm');
  if(propForm){
    const clienteSelectEl = document.getElementById('clienteSelect');
    if(clienteSelectEl) clienteSelectEl.addEventListener('change', ()=>{
      const box = document.getElementById('newClienteFields');
      if(box) box.style.display = clienteSelectEl.value ? 'none' : 'block';
    });
    const dispCheckEl = document.getElementById('dispCheck');
    if(dispCheckEl) dispCheckEl.addEventListener('change', ()=>{
      const box = document.getElementById('caratteristicheField');
      if(box) box.style.display = dispCheckEl.checked ? 'block' : 'none';
    });
    propForm.addEventListener('submit', async ev=>{
      ev.preventDefault();
      const fd = new FormData(propForm);
      let clienteId = fd.get('clienteId');
      if(!clienteId){
        const telefono = (fd.get('clienteTelefono')||'').trim();
        const nuovoCliente = saveCliente({ nome: fd.get('clienteNome')||'', telefono, email: fd.get('clienteEmail')||'', indirizzo: fd.get('clienteIndirizzo')||'', documenti: [] });
        clienteId = nuovoCliente.id;
      }
      const percentualeRaw = fd.get('percentualeProprietario');
      saveProperty({
        nome: fd.get('nome'),
        indirizzo: fd.get('indirizzo'),
        tipo: fd.get('tipo'),
        clienteId,
        percentualeProprietario: (percentualeRaw!==null && percentualeRaw!=='') ? Number(percentualeRaw) : 100,
        prezzoNotte: Number(fd.get('prezzoNotte'))||0,
        disponibilePrenotazioni: fd.get('disponibilePrenotazioni')==='on',
        capacitaAdulti: Number(fd.get('capacitaAdulti'))||0,
        capacitaBambini: Number(fd.get('capacitaBambini'))||0,
        animaliAmmessi: fd.get('animaliAmmessi')==='on',
        caratteristicheAnnuncio: fd.get('caratteristicheAnnuncio')||''
      }, (state.modal.editing && state.modal.editing.id) ? state.modal.editing.id : null);
    });
  }

  const expenseForm = document.getElementById('expenseForm');
  if(expenseForm) expenseForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(expenseForm);
    saveExpense(state.modal.propId, {
      data: fd.get('data'), categoria: fd.get('categoria'),
      importo: Number(fd.get('importo'))||0, descrizione: fd.get('descrizione')
    }, state.modal.editing ? state.modal.editing.id : null);
  });

  const pagaSpesaForm = document.getElementById('pagaSpesaForm');
  if(pagaSpesaForm) pagaSpesaForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(pagaSpesaForm);
    const fileInput = pagaSpesaForm.querySelector('input[type=file]');
    let ricevuta = null;
    if(fileInput && fileInput.files[0]){
      ricevuta = { url: await readAndCompressImage(fileInput.files[0]), descrizione: fd.get('descrizione')||'' };
    }
    pagaSpesa(state.modal.propId, state.modal.context.expId, { ricevuta });
  });

  const pagamentoBookingForm = document.getElementById('pagamentoBookingForm');
  if(pagamentoBookingForm) pagamentoBookingForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(pagamentoBookingForm);
    const fileInput = pagamentoBookingForm.querySelector('input[type=file]');
    let ricevuta = null;
    if(fileInput && fileInput.files[0]){
      ricevuta = { url: await readAndCompressImage(fileInput.files[0]), descrizione: fd.get('descrizione')||'' };
    }
    segnaPagamentoBooking(state.modal.propId, state.modal.context.bookingId, ricevuta);
  });

  const servizioForm = document.getElementById('servizioForm');
  if(servizioForm) servizioForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(servizioForm);
    saveServizio(state.modal.propId, {
      nome: fd.get('nome'), descrizione: fd.get('descrizione'),
      costo: Number(fd.get('costo'))||0, tipo: fd.get('tipo')
    });
  });

  const fotoImmobileForm = document.getElementById('fotoImmobileForm');
  if(fotoImmobileForm) fotoImmobileForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(fotoImmobileForm);
    const fileInput = fotoImmobileForm.querySelector('input[type=file]');
    if(!fileInput || !fileInput.files[0]) return;
    const url = await readAndCompressImage(fileInput.files[0]);
    addFotoImmobile(state.modal.propId, { url, descrizione: fd.get('descrizione'), categoria: state.modal.context });
  });

  const clienteForm = document.getElementById('clienteForm');
  if(clienteForm) clienteForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(clienteForm);
    const existingDocumenti = (state.modal.editing && state.modal.editing.documenti) || [];
    const fileInput = clienteForm.querySelector('input[name=documenti]');
    let nuoviDocumenti = [];
    if(fileInput && fileInput.files.length){
      nuoviDocumenti = await Promise.all([...fileInput.files].slice(0,4).map(f=>readAndCompressImage(f)));
    }
    const editingId = state.modal.editing ? state.modal.editing.id : null;
    const cliente = saveCliente({
      nome: fd.get('nome'), telefono: fd.get('telefono'),
      email: fd.get('email')||'', indirizzo: fd.get('indirizzo')||'',
      documenti: existingDocumenti.concat(nuoviDocumenti)
    }, editingId);
    saveData(); closeModal();
    state.selectedClienteId = cliente.id;
    state.selectedId = null;
    render();
  });

  document.querySelectorAll('[data-remove-documento]').forEach(b=>{
    b.addEventListener('click', ()=>{
      removeClienteDocumento(state.modal.editing.id, Number(b.getAttribute('data-remove-documento')));
    });
  });

  const contrattoGestioneForm = document.getElementById('contrattoGestioneForm');
  if(contrattoGestioneForm) contrattoGestioneForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(contrattoGestioneForm);
    saveContrattoGestione(state.modal.propId, {
      dataInizio: fd.get('dataInizio'), scadenza: fd.get('scadenza') || null,
      servizi: fd.get('servizi'), note: fd.get('note')
    });
  });

  const preventivoForm = document.getElementById('preventivoForm');
  if(preventivoForm) preventivoForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(preventivoForm);
    addPreventivo(state.modal.propId, state.modal.context.maintId, {
      fornitore: fd.get('fornitore'), importo: Number(fd.get('importo'))||0, note: fd.get('note')
    });
  });

  const completaForm = document.getElementById('completaForm');
  if(completaForm) completaForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(completaForm);
    const fileInput = completaForm.querySelector('input[type=file]');
    let fotoDopo = [];
    if(fileInput && fileInput.files.length){
      fotoDopo = await Promise.all([...fileInput.files].slice(0,4).map(f=>readAndCompressImage(f)));
    }
    completaIntervento(state.modal.propId, state.modal.context.maintId, {
      fotoDopo,
      fatturaImporto: fd.get('fatturaImporto') ? Number(fd.get('fatturaImporto')) : null,
      fatturaNota: fd.get('fatturaNota')
    });
  });

  const paymentForm = document.getElementById('paymentForm');
  if(paymentForm) paymentForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(paymentForm);
    savePayment(state.modal.propId, {
      data: fd.get('data'), importo: Number(fd.get('importo'))||0, note: fd.get('note')
    }, state.modal.editing ? state.modal.editing.id : null);
  });

  const versamentoForm = document.getElementById('versamentoForm');
  if(versamentoForm) versamentoForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(versamentoForm);
    saveVersamento(state.modal.propId, {
      data: fd.get('data'), importo: Number(fd.get('importo'))||0, nota: fd.get('nota')
    }, state.modal.editing ? state.modal.editing.id : null);
  });

  const voceListinoForm = document.getElementById('voceListinoForm');
  if(voceListinoForm) voceListinoForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(voceListinoForm);
    saveVoceListino(state.modal.propId, {
      nome: fd.get('nome'), costo: Number(fd.get('costo'))||0, periodicita: fd.get('periodicita')
    });
  });

  const controlloForm = document.getElementById('controlloForm');
  if(controlloForm) controlloForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(controlloForm);
    const fileInput = controlloForm.querySelector('input[type=file]');
    let foto = (state.modal.editing && state.modal.editing.foto) || [];
    if(fileInput && fileInput.files.length){
      const descrizioneFoto = fd.get('fotoDescrizione') || '';
      const nuove = await Promise.all([...fileInput.files].slice(0,6).map(async f=>({
        id: uid(), url: await readAndCompressImage(f), descrizione: descrizioneFoto
      })));
      foto = foto.concat(nuove);
    }
    const checklist = CHECKLIST_CONTROLLO.map((voce,i)=>({voce, stato: fd.get(`voce_${i}`)||'ok'}));
    saveControllo(state.modal.propId, {
      data: fd.get('data'), note: fd.get('note'), foto, checklist
    }, state.modal.editing ? state.modal.editing.id : null);
  });

  const maintForm = document.getElementById('maintForm');
  if(maintForm) maintForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(maintForm);
    const fileInput = maintForm.querySelector('input[type=file]');
    let foto = (state.modal.editing && state.modal.editing.foto) || [];
    if(fileInput && fileInput.files.length){
      const descrizioneFoto = fd.get('fotoDescrizione') || '';
      const nuove = await Promise.all([...fileInput.files].slice(0,4).map(async f=>({
        id: uid(), url: await readAndCompressImage(f), descrizione: descrizioneFoto
      })));
      foto = foto.concat(nuove);
    }
    const daControllo = state.modal.context && state.modal.context.daControllo;
    const propId = state.modal.propId;
    const editingId = state.modal.editing ? state.modal.editing.id : null;
    const nuovoIntervento = saveMaintenance(propId, {
      tipologia: fd.get('tipologia'),
      urgenza: fd.get('urgenza'),
      descrizione: fd.get('descrizione'),
      scadenza: fd.get('scadenza') || null,
      foto,
      richiedente: state.modal.context==='owner' ? 'Proprietario' : 'Gestore'
    }, editingId);
    if(daControllo && nuovoIntervento){
      linkInterventoAControllo(propId, daControllo.controlloId, daControllo.voce, nuovoIntervento.id);
    }
  });

  const programmaForm = document.getElementById('programmaForm');
  if(programmaForm) programmaForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(programmaForm);
    programmaIntervento(state.modal.propId, state.modal.context.maintId, fd.get('data'));
  });

  const fotoInterventoForm = document.getElementById('fotoInterventoForm');
  if(fotoInterventoForm) fotoInterventoForm.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const fd = new FormData(fotoInterventoForm);
    const fileInput = fotoInterventoForm.querySelector('input[type=file]');
    if(!fileInput || !fileInput.files[0]) return;
    const url = await readAndCompressImage(fileInput.files[0]);
    addFotoIntervento(state.modal.propId, state.modal.context.maintId, { url, descrizione: fd.get('descrizione') });
  });

  const settingsForm = document.getElementById('settingsForm');
  if(settingsForm) settingsForm.addEventListener('submit', ev=>{
    ev.preventDefault();
    const fd = new FormData(settingsForm);
    state.settings = { nomeAgenzia: fd.get('nomeAgenzia') || 'Property Manager', telefonoGestore: fd.get('telefonoGestore') || '', gestoreEmail: state.settings.gestoreEmail || '', impegnoServizio: fd.get('impegnoServizio') || '' };
    saveSettingsData();
    closeModal();
  });

  const bookingForm = document.getElementById('bookingForm');
  if(bookingForm) bookingForm.addEventListener('submit', ev=>ev.preventDefault());
}

render();
loadData().then(()=>{ checkAuthSession(); });
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* installazione non riuscita, l'app funziona comunque online */ });
  });
}
</script>
</body>
</html>
