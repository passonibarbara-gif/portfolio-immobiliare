<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Portfolio Immobiliare</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12302C">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio Imm.">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#241F1A;
    --ink-soft:#6E6558;
    --paper:#F3EFE7;
    --paper-raised:#FBF9F4;
    --brass:#0ABAB5;
    --brass-soft:#D6EFEC;
    --brass-deep:#0F8C86;
    --terracotta:#BC4632;
    --sage:#3E8C6E;
    --line:#DEDACB;
    --line-soft:#E9E4D5;
    --surface-dark:#12302C;
    --surface-dark-2:#193B36;
    --text-on-dark:#EAF6F3;
    --text-on-dark-soft:#9AC7C0;
    --tiffany:#7FEDE0;
    --coral:#F4845F;
    --brand-gradient: linear-gradient(120deg, var(--brass-deep) 0%, var(--brass) 55%, var(--tiffany) 100%);
  }
  *{box-sizing:border-box;}
  .ti{vertical-align:-2px; margin-right:3px; font-size:1em;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Top nav (selettore vista) ---------- */
  .topnav{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 32px; border-bottom:1px solid var(--brass-deep);
    background:linear-gradient(180deg,var(--surface-dark) 0%, var(--surface-dark-2) 100%);
    flex-wrap:wrap; gap:10px;
  }
  .topnav-brand{
    font-family:'Fraunces',serif; font-weight:600; font-size:17px; letter-spacing:.03em;
    color:var(--brass-soft); text-transform:uppercase; font-size:14px; letter-spacing:.14em;
  }
  .topnav-tabs{display:flex; gap:6px; flex-wrap:wrap;}
  .tab-btn{
    background:none; border:1px solid rgba(47,184,170,0.35); padding:8px 16px; border-radius:8px;
    font-size:12px; cursor:pointer; color:var(--text-on-dark-soft); font-family:'IBM Plex Sans',sans-serif;
    letter-spacing:.03em; transition:all .15s ease;
  }
  .tab-btn:hover{border-color:var(--brass); color:var(--text-on-dark);}
  .tab-btn.active{background:var(--brass); color:var(--surface-dark); border-color:var(--brass); font-weight:600;}

  .nav-badge{
    display:inline-flex; align-items:center; justify-content:center; min-width:17px; height:17px;
    background:var(--terracotta); color:#fff; font-family:'IBM Plex Mono',monospace;
    font-size:10px; font-weight:700; padding:0 5px; border-radius:20px; margin-left:6px; vertical-align:middle;
  }

  /* ---- campanella notifiche (riusa gli alert reali del portfolio) ---- */
  .notif-wrap{position:relative;}
  .notif-btn{
    position:relative; border:1px solid rgba(47,184,170,0.35); background:none; color:var(--text-on-dark);
    width:36px; height:36px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:border-color .15s ease, color .15s ease;
  }
  .notif-btn:hover{border-color:var(--brass); color:var(--brass);}
  .notif-badge{
    position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 3px;
    background:var(--terracotta); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:700;
    border-radius:20px; display:flex; align-items:center; justify-content:center;
  }
  .notif-panel{
    position:absolute; top:46px; right:0; width:300px; z-index:60;
    background:var(--paper-raised); border:1px solid var(--line-soft); border-radius:10px; padding:6px;
    box-shadow:0 14px 34px rgba(28,26,23,.22);
    opacity:0; transform:translateY(-8px) scale(.95); pointer-events:none;
  }
  .notif-panel.show{animation:notifIn .35s cubic-bezier(.22,1.4,.4,1) forwards; pointer-events:auto;}
  @keyframes notifIn{ 0%{opacity:0; transform:translateY(-10px) scale(.92);} 100%{opacity:1; transform:translateY(0) scale(1);} }
  .notif-panel-title{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); padding:9px 10px 7px;}
  .notif-item{display:flex; gap:9px; align-items:flex-start; padding:9px 10px; border-radius:7px; cursor:pointer; font-size:12.5px; color:var(--ink); line-height:1.4;}
  .notif-item:hover{background:var(--brass-soft);}
  .notif-item .n-dot{width:7px; height:7px; border-radius:50%; background:var(--terracotta); margin-top:5px; flex-shrink:0;}
  .notif-item.unread{background:var(--brass-soft);}
  .notif-item.unread .n-dot{background:var(--brass-deep);}
  .notif-item .n-dot.read{background:var(--line);}
  .notif-item-sub{font-size:10px; color:var(--ink-soft); margin-top:2px;}
  .notif-empty{padding:16px 10px; font-size:12.5px; color:var(--ink-soft); text-align:center;}

  .alert-banner{
    background:#F1DAD1; border:1px solid var(--terracotta); border-radius:8px;
    padding:16px 20px; margin-bottom:28px;
  }
  .alert-banner-title{font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--terracotta); margin-bottom:8px;}
  .alert-banner-item{font-size:13px; color:var(--ink); padding:2px 0;}
  .alert-banner-item b{color:var(--terracotta);}
  .alert-banner-item.clickable{cursor:pointer; text-decoration:underline; text-decoration-color:transparent; transition:text-decoration-color .15s ease;}
  .alert-banner-item.clickable:hover{text-decoration-color:var(--terracotta);}

  .app{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:calc(100vh - 61px);
  }
  @media (max-width:760px){
    .app{grid-template-columns:1fr;}
    .sidebar{border-right:none;border-bottom:1px solid var(--line);}
  }

  /* ---------- Sidebar (schedario) ---------- */
  .sidebar{
    border-right:1px solid var(--brass-deep);
    padding:28px 18px;
    background:linear-gradient(180deg,var(--surface-dark) 0%, var(--surface-dark-2) 100%);
    position:relative;
  }
  .sidebar::before{
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:var(--brand-gradient);
  }
  .brand{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:.01em;
    color:var(--text-on-dark);
    margin:0 0 2px 0;
  }
  .brand-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;
    color:var(--text-on-dark-soft);
    text-transform:uppercase;
    letter-spacing:.12em;
    margin:0 0 26px 0;
    display:flex; align-items:center; gap:8px;
  }
  .brand-sub::after{ content:''; flex:1; height:1px; background:var(--text-on-dark-soft); opacity:.25; }
  .nav-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px;
    border-radius:10px;
    margin-bottom:3px;
    cursor:pointer;
    font-size:14px;
    color:var(--text-on-dark-soft);
    position:relative;
    transition:background .18s ease, color .18s ease, transform .15s ease, box-shadow .18s ease;
  }
  .nav-item:hover{background:rgba(127,237,224,0.08); color:var(--text-on-dark); transform:translateX(3px);}
  .nav-item.active{
    background:linear-gradient(90deg, rgba(10,186,181,0.28), rgba(127,237,224,0.05));
    color:var(--text-on-dark); font-weight:600;
    box-shadow:inset 3px 0 0 var(--tiffany), 0 2px 10px rgba(10,186,181,0.15);
  }
  .nav-item .code{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--text-on-dark-soft); opacity:.7;}
  .nav-item-main{display:flex; align-items:center;}
  .nav-icon{
    display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;
    width:26px; height:26px; border-radius:8px; margin-right:10px; font-size:14px;
    background:rgba(255,255,255,0.05); color:var(--tiffany);
    transition:background .18s ease;
  }
  .nav-item.active .nav-icon{background:rgba(127,237,224,0.2);}
  .nav-section-label{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px; text-transform:uppercase; letter-spacing:.12em;
    color:var(--text-on-dark-soft); opacity:.65; margin:26px 0 8px 4px;
    display:flex; align-items:center; gap:6px;
  }
  .nav-section-label::before{ content:''; width:10px; height:1px; background:var(--tiffany); opacity:.7; flex-shrink:0; }
  .badge-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-left:8px;}
  .btn-new{
    width:100%;
    margin-top:18px;
    padding:12px 12px;
    background:var(--brand-gradient);
    color:var(--surface-dark);
    border:none;
    border-radius:10px;
    font-family:'IBM Plex Sans',sans-serif;
    font-size:12.5px; font-weight:700;
    cursor:pointer;
    letter-spacing:.05em;
    text-transform:uppercase;
    transition:filter .15s ease, transform .15s ease;
  }
  .btn-new:hover{filter:brightness(1.08); transform:translateY(-1px);}

  /* ---------- Main ---------- */
  main{padding:40px 48px; max-width:920px;}
  @media (max-width:760px){ main{padding:24px 20px;} }
  h1.page-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:33px; letter-spacing:-.01em;
    margin:0 0 4px 0;
  }
  .page-sub{color:var(--ink-soft); font-size:14px; margin:0 0 32px 0;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:36px;}
  @media (max-width:760px){ .stat-row{grid-template-columns:repeat(2,1fr);} }
  .stat-card{
    background:var(--line-soft);
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:18px 20px;
    box-shadow:0 1px 2px rgba(28,26,23,0.04);
  }
  .stat-label{font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:9px;}
  .stat-value{font-family:'Fraunces',serif; font-size:25px; font-weight:600;}
  .stat-value.sage{color:var(--sage);}
  .stat-value.terracotta{color:var(--terracotta);}

  /* ---- riepilogo Panoramica in stile "bento" ---- */
  .bento-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:36px;}
  @media (max-width:700px){ .bento-row{grid-template-columns:repeat(2,1fr);} }
  .bento-tile{
    background:var(--line-soft); border:1px solid var(--line-soft); border-radius:14px;
    padding:22px 22px; box-shadow:0 1px 3px rgba(28,26,23,0.05); position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center;
  }
  .bento-label{font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:14px;}
  .bento-value{font-family:'Fraunces',serif; font-size:24px; font-weight:700; background:var(--brand-gradient); -webkit-background-clip:text; background-clip:text; color:transparent; white-space:nowrap;}
  .bento-value.terracotta{background:none; -webkit-text-fill-color:initial; color:var(--terracotta);}
  .bento-tile .bento-sub{font-size:12.5px; color:var(--ink-soft); margin-top:10px;}

  .prop-type-icon{display:inline-flex; align-items:center; justify-content:center; vertical-align:-6px; margin-right:7px; width:24px; height:24px; border-radius:7px; border:1px solid var(--line-soft); color:var(--brass-deep); flex-shrink:0;}

  .section-label{
    font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase;
    letter-spacing:.14em; color:var(--brass-deep); margin:0 0 14px 0; padding-bottom:9px;
    border-bottom:1px solid var(--brass-soft);
  }

  /* ---- grafico guadagno agenzia, costruito da zero ---- */
  .chart-card{
    background:var(--line-soft); border:1px solid var(--line-soft); border-radius:12px;
    padding:22px 24px; margin-bottom:24px;
  }
  .chart-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; flex-wrap:wrap; gap:8px;}
  .chart-head h4{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); font-weight:500; margin:0;}
  .chart-total{font-family:'Fraunces',serif; font-weight:700; font-size:21px;}
  .chart-card svg{width:100%; height:auto; overflow:visible; margin-top:8px;}
  .chart-legend{display:flex; gap:18px; margin-top:8px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft);}
  .chart-legend b{color:var(--ink); font-weight:500;}

  /* property cards - schede catastali */
  .prop-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px;}
  .prop-card{
    position:relative;
    background:var(--line-soft);
    border:1px solid var(--line-soft);
    border-radius:12px;
    padding:20px;
    cursor:pointer;
    box-shadow:0 1px 3px rgba(28,26,23,0.05);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .prop-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(28,26,23,0.12); border-color:var(--brass);}
  .prop-card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:2px;}
  .prop-card-main{display:flex; gap:12px; align-items:flex-start;}
  .prop-catasto{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft); letter-spacing:.04em;}
  .prop-name{font-family:'Fraunces',serif; font-weight:700; font-size:17px; margin:0 0 3px 0; display:flex; align-items:center;}
  .prop-addr{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
  .prop-value{font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:500;}
  .prop-rent{font-size:11.5px; font-family:'IBM Plex Mono',monospace; color:var(--sage); margin-bottom:4px;}
  .prop-rent.vacant{color:var(--ink-soft);}
  .prop-rent.expiring{color:var(--terracotta);}
  .prop-bookable{font-size:11px; color:var(--brass-deep); margin-bottom:6px; font-weight:500;}
  .prop-card-foot{display:flex; justify-content:space-between; align-items:baseline; margin-top:10px; padding-top:10px; border-top:1px solid var(--line);}
  .prop-price{font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink); font-weight:500;}
  .status-seal{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em; padding:3px 10px;
    border-radius:20px; border:1px solid currentColor; white-space:nowrap; flex-shrink:0;
  }
  .status-seal.ok{color:var(--sage);}
  .status-seal.prog{color:var(--brass-deep);}
  .status-seal.att{color:var(--terracotta);}
  .seal{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%;
    border:1.3px dashed var(--sage); color:var(--sage);
    font-size:11px; flex-shrink:0; transform:rotate(-6deg);
    margin-right:5px; vertical-align:-5px;
  }

  /* dossier detail */
  .dossier-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .dossier-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .dossier-tabs{
    display:flex; gap:8px; flex-wrap:wrap; margin:22px 0 28px 0;
  }
  .dossier-tab-btn{
    background:var(--line-soft); border:1px solid var(--line-soft); padding:9px 15px 9px 12px;
    border-radius:20px; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif; letter-spacing:.02em;
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
    transition:background .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .dossier-tab-btn i{font-size:14px; margin-right:0;}
  .dossier-tab-btn:hover:not(.active){border-color:var(--brass); color:var(--ink);}
  .dossier-tab-btn.active{
    background:var(--brand-gradient); border-color:transparent; color:#fff; font-weight:600;
    box-shadow:0 3px 10px rgba(10,186,181,0.25);
  }

  .foto-card{
    background:var(--line-soft); border:1px solid var(--line-soft); border-radius:10px;
    overflow:hidden; margin-bottom:12px; display:flex; gap:0;
  }
  .foto-card img{width:110px; height:100px; object-fit:cover; flex-shrink:0; border-radius:6px 0 0 6px;}
  .foto-card-body{padding:10px 14px; flex:1; display:flex; flex-direction:column; justify-content:center; gap:6px;}
  .foto-card-desc{font-size:13px; color:var(--ink);}
  .foto-card-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .badge-copertina{
    display:inline-flex; align-items:center; gap:4px; background:var(--brass); color:var(--surface-dark);
    font-size:10px; font-weight:600; padding:3px 9px; border-radius:20px; text-transform:uppercase; letter-spacing:.04em;
  }
  .prop-cover{width:100%; height:130px; object-fit:cover; border-radius:12px 12px 0 0; margin:-20px -20px 14px -20px; width:calc(100% + 40px);}
  .icon-btn{
    background:none; border:1px solid var(--line); border-radius:8px;
    padding:7px 14px; font-size:12px; cursor:pointer; color:var(--ink-soft);
    font-family:'IBM Plex Sans',sans-serif; letter-spacing:.02em;
    transition:all .15s ease;
  }
  .icon-btn:hover{border-color:var(--brass); color:var(--brass-deep); background:var(--brass-soft);}
  .icon-btn.danger:hover{border-color:var(--terracotta); color:var(--terracotta); background:transparent;}

  .info-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin:24px 0 36px 0;}
  @media (max-width:760px){ .info-grid{grid-template-columns:repeat(2,1fr);} }

  table{width:100%; border-collapse:collapse; margin-bottom:36px;}
  th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft);
    padding:8px 10px; border-bottom:1px solid var(--line);
  }
  td{padding:10px 10px; border-bottom:1px solid var(--line-soft); font-size:13.5px; vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .cell-num{font-family:'IBM Plex Mono',monospace;}
  .row-actions{text-align:right;}
  .link-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;text-decoration:underline;padding:0;}
  .link-btn:hover{color:var(--terracotta);}
  .empty-row{color:var(--ink-soft); font-style:italic; font-size:13px; padding:16px 10px;}

  .status-pill{
    display:inline-block; padding:2px 8px; border-radius:20px;
    font-size:11px; font-family:'IBM Plex Mono',monospace;
  }
  .status-pill.programmata{background:var(--brass-soft); color:var(--brass-deep);}
  .status-pill.in-corso{background:#F1DAD1; color:var(--terracotta);}
  .status-pill.completata{background:#DCE6DE; color:var(--sage);}

  .add-inline{
    background:none; border:1px dashed var(--brass-soft); color:var(--brass-deep);
    border-radius:8px; padding:9px 16px; font-size:12.5px; cursor:pointer; margin-bottom:36px; font-family:'IBM Plex Sans',sans-serif; letter-spacing:.02em;
    transition:all .15s ease;
  }
  .add-inline:hover{border-color:var(--brass); background:var(--brass-soft);}

  /* modal */
  .overlay{
    position:fixed; inset:0; background:rgba(33,44,54,0.45);
    display:flex; align-items:center; justify-content:center; z-index:50;
    padding:20px;
  }
  .modal{
    background:var(--paper-raised); border-radius:6px; padding:28px 30px;
    width:100%; max-width:440px; max-height:88vh; overflow-y:auto;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal h2{font-family:'Fraunces',serif; font-size:20px; margin:0 0 20px 0;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:6px; font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.06em;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line);
    border-radius:4px; font-size:14px; font-family:'IBM Plex Sans',sans-serif;
    background:#fff; color:var(--ink); transition:border-color .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--brass); }
  .field input[type=checkbox]{width:auto;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:24px;}
  .btn-primary{
    background:var(--brand-gradient); color:#fff; border:1px solid transparent;

    document.head.appendChild(s);
  });
}

  return false;
}

function catastoCode(seed){
  let h=0; for(const c of seed) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const foglio = (h % 40) + 1;
  const particella = (h % 900) + 100;
  return `F.${foglio} Part.${particella}`;
}
function daysUntil(dateStr){
  if(!dateStr) return Infinity;
  const diff = new Date(dateStr) - new Date();
  return Math.ceil(diff / 86400000);
}
function propertyStatus(p){
  const attive = (p.manutenzioni||[]).filter(m=>m.stato!=='completata');
  const urgent = attive.some(m => daysUntil(m.scadenza) <= 14);
  if(urgent) return 'att';
  if(attive.length>0) return 'prog';
  return 'ok';
}

function rentInfo(p){

function readAndCompressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 640;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- Autenticazione gestore (Supabase Auth) ----------
function autorizzaSessione(email){
  if(email && state.settings.gestoreEmail && email.toLowerCase()===state.settings.gestoreEmail.toLowerCase()){
    state.gestoreRole = 'admin';
    state.operatoreAttivo = null;
    state.gestoreAccessNegato = false;
    return true;
  }
  const op = getOperatoreByEmail(email);
  if(op){
    state.gestoreRole = 'operatore';
    state.operatoreAttivo = op;
    state.gestoreAccessNegato = false;
    return true;
  }
  // autenticato con Supabase ma non autorizzato su questa piattaforma
  state.gestoreRole = null;
  state.operatoreAttivo = null;
  state.gestoreAccessNegato = true;
  return false;
}

async function checkAuthSession(){
  if(!SUPABASE_CONFIGURED || SUPABASE_LIB_ERROR || !supabase) return;
  try{
    const { data } = await supabase.auth.getSession();
    if(data && data.session && data.session.user){
      state.gestoreAuthUser = data.session.user.email;
      if(autorizzaSessione(data.session.user.email)){
        state.gestoreUnlocked = true;
      } else {
        state.gestoreUnlocked = false;
      }
      render();
    }
  }catch(e){ /* nessuna sessione attiva, resta al login */ }

  supabase.auth.onAuthStateChange((event, session)=>{
    if(event === 'PASSWORD_RECOVERY'){
      const recEmail = (session && session.user && session.user.email || '').toLowerCase();
      if(state.settings.gestoreEmail && recEmail === state.settings.gestoreEmail.toLowerCase()){
        state.gestoreRecoveryMode = true;
      } else {
        state.ownerRecoveryMode = true;
        state.ownerRecoveryEmail = recEmail || null;
      }
      render();
    }
    if(event === 'SIGNED_IN' && session && session.user){
      state.gestoreAuthUser = session.user.email;
      state.gestoreUnlocked = autorizzaSessione(session.user.email);
    }
    if(event === 'SIGNED_OUT'){
      state.gestoreUnlocked = false;
      state.gestoreAuthUser = null;
      state.gestoreRole = null;
      state.operatoreAttivo = null;
    }
  });
}
async function signUpGestore(email, password){
  try{
    const { data, error } = await supabase.auth.signUp({ email, password });
    if(error) throw error;
    state.settings.gestoreEmail = email;
    saveSettingsData();
    state.error = null;
    if(data && data.session){
      // conferma email disattivata sul progetto: accesso immediato
      state.gestoreUnlocked = true;
      state.gestoreAuthUser = email;
      state.gestoreRole = 'admin';
      state.operatoreAttivo = null;
    } else {
      // Supabase richiede la conferma via email prima di attivare l'account
      state.gestoreSetupFatto = true;
    }
    render();
  }catch(e){
    state.error = 'Impossibile creare l\'accesso: ' + (e && e.message ? e.message : 'errore sconosciuto');
    render();
  }
}
async function signInGestore(email, password){

    state.gestoreAuthUser = email;

  }
}

// ---------- Guadagno proprietario & versamenti ----------
function calcolaDashboard(p){
  const oggi = new Date();
  const meseCorrente = oggi.getMonth(), annoCorrente = oggi.getFullYear();
  const giorniNelMese = new Date(annoCorrente, meseCorrente+1, 0).getDate();

  // stato generale
  const interventiAperti = (p.manutenzioni||[]).filter(m=>m.stato!=='completata');
  const preventiviInAttesa = (p.manutenzioni||[]).filter(m=>m.preventivo && m.preventivo.stato==='in-attesa').length;
  const prossimoControllo = calcProssimoControllo(p);
  let stato = 'Tutto regolare';
  if(preventiviInAttesa>0) stato = `${preventiviInAttesa} preventivo${preventiviInAttesa>1?'i':''} da approvare`;
  else if(interventiAperti.length>0) stato = `${interventiAperti.length} intervento${interventiAperti.length>1?'i':''} in corso`;
  else if(prossimoControllo.inRitardo) stato = 'Controllo periodico in ritardo';

  // occupazione mese corrente (solo per prenotabili brevi)
  let occupazione = null;
  if(p.disponibilePrenotazioni){
    const {confirmed} = getBookedDaysMap(p.prenotazioni);
    let giorniOccupati = 0;
    for(let d=1; d<=giorniNelMese; d++){
      const key = `${annoCorrente}-${String(meseCorrente+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      if(confirmed.has(key)) giorniOccupati++;
    }
    occupazione = Math.round((giorniOccupati/giorniNelMese)*100);
  } else if(p.locazione && p.locazione.attivo){
    occupazione = 100;
  }

  // ricavi del mese corrente
  let ricaviMese = 0;
  (p.prenotazioni||[]).filter(b=>b.stato==='confermata').forEach(b=>{
    const ci = new Date(b.checkin);
    if(ci.getMonth()===meseCorrente && ci.getFullYear()===annoCorrente) ricaviMese += Number(b.totale||0);
  });
  if(p.locazione && p.locazione.attivo){
    (p.locazione.pagamenti||[]).forEach(pay=>{
      const d = new Date(pay.data);
      if(d.getMonth()===meseCorrente && d.getFullYear()===annoCorrente) ricaviMese += Number(pay.importo||0);
    });
  }

  // prossimo soggiorno
  const prossime = (p.prenotazioni||[]).filter(b=>b.stato==='confermata' && new Date(b.checkin) >= oggi).sort((a,b)=>new Date(a.checkin)-new Date(b.checkin));
  const prossimoSoggiorno = prossime.length ? prossime[0].checkin : null;

  return { stato, occupazione, ricaviMese, prossimoSoggiorno, preventiviInAttesa, controlloInRitardo: prossimoControllo.inRitardo };
}

function scaricaReport(p){
  const g = calcolaGuadagnoProprietario(p);
  const d = calcolaDashboard(p);
  const oggi = new Date().toLocaleDateString('it-IT',{month:'long', year:'numeric'});
  const righe = [
    `REPORT — ${p.nome}`,
    `Periodo: ${oggi}`,
    ``,
    `Stato: ${d.stato}`,
    d.occupazione!==null ? `Occupazione mese: ${d.occupazione}%` : '',
    `Ricavi del mese: ${fmtCurrency(d.ricaviMese)}`,
    d.prossimoSoggiorno ? `Prossimo soggiorno: ${fmtDate(d.prossimoSoggiorno)}` : '',
    ``,
    `Ricavi totali: ${fmtCurrency(g.ricaviTotali)}`,
    `Percentuale riconosciuta: ${g.percentuale}%`,
    `Guadagno maturato: ${fmtCurrency(g.guadagnoMaturato)}`,
    `Già versato: ${fmtCurrency(g.versato)}`,
    `Saldo in sospeso: ${fmtCurrency(g.saldoInSospeso)}`,
    ``,
    `Interventi registrati: ${(p.manutenzioni||[]).length}`,
    `Controlli periodici effettuati: ${(p.controlli||[]).length}`,
  ].filter(Boolean).join('\n');
  const blob = new Blob([righe], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `report-${p.nome.replace(/[^a-z0-9]/gi,'-').toLowerCase()}.txt`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function calcolaGuadagnoProprietario(p){
  const ricaviLocazione = ((p.locazione && p.locazione.pagamenti) || []).reduce((s,x)=>s+Number(x.importo||0),0);
  const ricaviPrenotazioni = (p.prenotazioni||[]).filter(b=>b.stato==='confermata').reduce((s,b)=>s+Number(b.totale||0),0);
  const ricaviTotali = ricaviLocazione + ricaviPrenotazioni;
  const percentuale = (p.percentualeProprietario !== undefined && p.percentualeProprietario !== null && p.percentualeProprietario !== '') ? Number(p.percentualeProprietario) : 100;
  const guadagnoMaturato = ricaviTotali * (percentuale/100);
  const versato = (p.versamentiProprietario||[]).reduce((s,v)=>s+Number(v.importo||0),0);
  const saldoInSospeso = guadagnoMaturato - versato;
  return {ricaviTotali, percentuale, guadagnoMaturato, versato, saldoInSospeso};
}
function calcolaCommissioneMensile(p, mesi){
  const now = new Date();
  const percentuale = (p.percentualeProprietario !== undefined && p.percentualeProprietario !== null && p.percentualeProprietario !== '') ? Number(p.percentualeProprietario) : 100;
  const quotaAgenzia = 1 - (percentuale/100);
  const risultati = [];
  for(let i = mesi-1; i>=0; i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    let ricavi = 0;
    (p.prenotazioni||[]).filter(b=>b.stato==='confermata').forEach(b=>{
      const ci = new Date(b.checkin);
      if(ci.getMonth()===d.getMonth() && ci.getFullYear()===d.getFullYear()) ricavi += Number(b.totale||0);
    });
    if(p.locazione && p.locazione.attivo){
      (p.locazione.pagamenti||[]).forEach(pay=>{
        const pd = new Date(pay.data);
        if(pd.getMonth()===d.getMonth() && pd.getFullYear()===d.getFullYear()) ricavi += Number(pay.importo||0);
      });
    }
    risultati.push({ label: d.toLocaleDateString('it-IT',{month:'short'}), commissione: Math.round(ricavi*quotaAgenzia) });
  }
  return risultati;
}
function renderGuadagnoChart(dati){
  const max = Math.max(...dati.map(d=>d.commissione), 1);
  const padL=20, padR=20, top=20, base=150, w=640;
  const n = dati.length;
  const stepX = n>1 ? (w-padL-padR)/(n-1) : 0;
  const pts = dati.map((d,i)=>({ x: padL+i*stepX, y: base-(Math.max(d.commissione,0)/max)*(base-top), ...d }));
  const linePath = pts.map((pt,i)=> (i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[n-1].x.toFixed(1)},${base} L${pts[0].x.toFixed(1)},${base} Z`;
  const last = pts[n-1];
  const totale = dati.reduce((s,d)=>s+d.commissione,0);
  const media = Math.round(totale/n);
  const primo = dati[0].commissione;
  const trend = primo>0 ? Math.round(((last.commissione-primo)/primo)*100) : null;
  const labelsSvg = pts.map(pt=>`<text x="${pt.x.toFixed(1)}" y="172">${pt.label}</text>`).join('');
  const ariaDesc = dati.map(d=>d.label+': '+fmtCurrency(d.commissione)).join(', ');
  return `
    <div class="chart-card">
      <div class="chart-head">
        <h4>Commissione agenzia · ultimi ${n} mesi</h4>
        <div class="chart-total num">${fmtCurrency(totale)}</div>
      </div>
      <svg viewBox="0 0 640 210" role="img" aria-label="Commissione agenzia mensile: ${ariaDesc}.">
        <defs>
          <linearGradient id="ggFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" style="stop-color:var(--brass); stop-opacity:.3"/>
            <stop offset="100%" style="stop-color:var(--brass); stop-opacity:0"/>
          </linearGradient>
          <linearGradient id="ggLine" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" style="stop-color:var(--brass-deep)"/>
            <stop offset="100%" style="stop-color:var(--brass)"/>
          </linearGradient>
        </defs>
        <g style="stroke:var(--line-soft); stroke-width:1;">
          <line x1="20" y1="20" x2="620" y2="20"/><line x1="20" y1="60" x2="620" y2="60"/>
          <line x1="20" y1="100" x2="620" y2="100"/><line x1="20" y1="150" x2="620" y2="150"/>
        </g>
        <path d="${areaPath}" fill="url(#ggFill)"/>
        <path d="${linePath}" fill="none" style="stroke:url(#ggLine); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round;"/>
        <g style="fill:var(--ink-soft); font-family:'IBM Plex Mono',monospace; font-size:11px;">${labelsSvg}</g>
        <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="8" fill="var(--brass)" opacity=".18"/>
        <circle cx="${last.x.toFixed(1)}" cy="${last.y.toFixed(1)}" r="4" style="fill:var(--brass); stroke:var(--paper-raised); stroke-width:2;"/>
      </svg>
      <div class="chart-legend">
        <span>Media mensile <b class="num">${fmtCurrency(media)}</b></span>
        ${trend!==null ? `<span>Trend <b style="color:${trend>=0?'var(--sage)':'var(--terracotta)'};">${trend>=0?'+':''}${trend}% nel periodo</b></span>` : ''}
      </div>
    </div>
  `;
}

function calcolaMesiContratto(p){
  const inizio = p.contrattoGestione && p.contrattoGestione.dataInizio;
  if(!inizio) return 0;
  const d1 = new Date(inizio), d2 = new Date();
  let mesi = (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
  if(d2.getDate() < d1.getDate()) mesi--;
  return Math.max(0, mesi) + 1; // include il mese corrente
}
function calcolaGuadagnoAgenzia(p){
  const g = calcolaGuadagnoProprietario(p);
  const commissioneAgenzia = g.ricaviTotali - g.guadagnoMaturato;
  const mesiContratto = calcolaMesiContratto(p);
  const numInterventi = (p.manutenzioni||[]).length;
  const voci = (p.listinoServizi||[]).map(v=>{
    let importo = 0, dettaglio = '';
    if(v.periodicita==='mensile'){ importo = Number(v.costo||0)*mesiContratto; dettaglio = `${mesiContratto} mes${mesiContratto===1?'e':'i'} di contratto`; }
    else if(v.periodicita==='per-intervento'){ importo = Number(v.costo||0)*numInterventi; dettaglio = `${numInterventi} intervent${numInterventi===1?'o':'i'}`; }
    else { importo = Number(v.costo||0); dettaglio = 'una tantum'; }
    return { nome: v.nome, importo, dettaglio };
  });
  const totaleServizi = voci.reduce((s,v)=>s+v.importo,0);
  const totaleAgenzia = commissioneAgenzia + totaleServizi;
  return { commissioneAgenzia, voci, totaleServizi, totaleAgenzia, ricaviTotali: g.ricaviTotali };
}

const CHECKLIST_CONTROLLO = [
  'Impianto idraulico (rubinetti, scarichi, perdite)',
  'Impianto elettrico ed elettrodomestici',
  'Muri, soffitti, umidità',

function calcEsitoControllo(checklist){
  if(!checklist || !checklist.length) return 'regolare';
  return checklist.some(v=>v.stato==='problema') ? 'attenzione' : 'regolare';
}

function vociRisolta(v, p){
  if(v.stato==='ok') return true;
  if(v.stato==='problema' && v.interventoId){
    const interv = (p.manutenzioni||[]).find(m=>m.id===v.interventoId);
    return interv && interv.stato==='completata';
  }
  return false;
}
function isControlloConcluso(c, p){
  if(!c.checklist || !c.checklist.length) return true;
  return c.checklist.every(v=>vociRisolta(v, p));
}
function statoControlloLabel(c, p){
  if(isControlloConcluso(c, p)) return {label:'✓ Concluso', cls:'completata'};
  const problemaAperto = (c.checklist||[]).some(v=>v.stato==='problema' && !vociRisolta(v, p));
  if(problemaAperto) return {label:'Attenzione', cls:'in-corso'};
  return {label:'Da verificare', cls:'programmata'};
}

function calcProssimoControllo(p){
  const periodicita = p.periodicitaControlli || 2;
  const lista = (p.controlli||[]).slice().sort((a,b)=>new Date(b.data)-new Date(a.data));
  if(!lista.length) return { data: null, inRitardo: true };
  const ultimo = new Date(lista[0].data);
  const prossima = new Date(ultimo);
  prossima.setMonth(prossima.getMonth() + periodicita);
  return { data: prossima.toISOString().slice(0,10), inRitardo: prossima < new Date() };
}

// ---------- Centro avvisi ----------
function calcolaAlertImmobile(p){
  const prenotazioniPendenti = (p.prenotazioni||[]).filter(b=>b.stato==='richiesta').length;
  const spesePagare = (p.spese||[]).filter(e=>(e.stato||'in-attesa')==='approvata').length;
  const controlloInRitardo = calcProssimoControllo(p).inRitardo ? 1 : 0;
  const preventiviRisposti = (p.manutenzioni||[]).filter(m =>
    m.preventivo && m.stato!=='completata' &&
    ((m.preventivo.stato==='approvato' && !m.dataProgrammazione) || m.preventivo.stato==='rifiutato')
  ).length;
  const messaggiProprietario = (p.messaggi||[]).filter(m=>m.autore!=='gestore' && !m.letto).length;
  const messaggiOspiti = (p.prenotazioni||[]).reduce((s,b)=>s+(b.messaggiOspite||[]).filter(m=>m.autore!=='gestore' && !m.letto).length, 0);
  const messaggiNonLetti = messaggiProprietario + messaggiOspiti;
  const interventiDaTriage = (p.manutenzioni||[]).filter(m => m.stato==='programmata' && !m.preventivo && !m.dataProgrammazione).length;
  const totale = prenotazioniPendenti + spesePagare + controlloInRitardo + preventiviRisposti + messaggiNonLetti + interventiDaTriage;
  return { totale, prenotazioniPendenti, spesePagare, controlloInRitardo, preventiviRisposti, messaggiProprietario, messaggiOspiti, messaggiNonLetti, interventiDaTriage };
}
function calcolaAlertProprietario(p){
  const preventiviInAttesa = (p.manutenzioni||[]).filter(m=>m.preventivo && m.preventivo.stato==='in-attesa').length;
  const speseInAttesa = (p.spese||[]).filter(e=>(e.stato||'in-attesa')==='in-attesa').length;
  const controlloInRitardo = calcProssimoControllo(p).inRitardo ? 1 : 0;
  const totale = preventiviInAttesa + speseInAttesa + controlloInRitardo;
  return { totale, preventiviInAttesa, speseInAttesa, controlloInRitardo };
}
function calcolaAlertPortfolio(){
  let prenotazioniPendenti=0, spesePagare=0, controlliRitardo=0, preventiviRisposti=0, messaggiProprietario=0, messaggiOspiti=0, interventiDaTriage=0;
  immobiliVisibili().forEach(p=>{
    const a = calcolaAlertImmobile(p);
    prenotazioniPendenti += a.prenotazioniPendenti;
    spesePagare += a.spesePagare;
    controlliRitardo += a.controlloInRitardo;
    preventiviRisposti += a.preventiviRisposti;
    messaggiProprietario += a.messaggiProprietario;
    messaggiOspiti += a.messaggiOspiti;
    interventiDaTriage += a.interventiDaTriage;
  });
  const messaggiNonLetti = messaggiProprietario + messaggiOspiti;
  return {
    totale: prenotazioniPendenti+spesePagare+controlliRitardo+preventiviRisposti+messaggiNonLetti+interventiDaTriage,
    prenotazioniPendenti, spesePagare, controlliRitardo, preventiviRisposti, messaggiProprietario, messaggiOspiti, messaggiNonLetti, interventiDaTriage
  };
}
function trovaPrimoImmobileConAlert(tipo){
  if(tipo==='prenotazioni') return state.properties.find(p=>(p.prenotazioni||[]).some(b=>b.stato==='richiesta'));
  if(tipo==='spese') return state.properties.find(p=>(p.spese||[]).some(e=>(e.stato||'in-attesa')==='approvata'));
  if(tipo==='controlli') return state.properties.find(p=>calcProssimoControllo(p).inRitardo);
  if(tipo==='interventi') return state.properties.find(p=>(p.manutenzioni||[]).some(m =>
    m.preventivo && m.stato!=='completata' &&
    ((m.preventivo.stato==='approvato' && !m.dataProgrammazione) || m.preventivo.stato==='rifiutato')
  ));
  if(tipo==='interventi-nuovi') return state.properties.find(p=>(p.manutenzioni||[]).some(m => m.stato==='programmata' && !m.preventivo && !m.dataProgrammazione));
  if(tipo==='messaggi') return state.properties.find(p=>(p.messaggi||[]).some(m=>m.autore!=='gestore' && !m.letto));
  if(tipo==='messaggi-ospiti') return state.properties.find(p=>(p.prenotazioni||[]).some(b=>(b.messaggiOspite||[]).some(m=>m.autore!=='gestore' && !m.letto)));
  return null;
}

function raccogliEventiPortfolio(){
  const eventi = [];
  immobiliVisibili().forEach(p=>{
    (p.prenotazioni||[]).filter(b=>b.stato!=='rifiutata').forEach(b=>{
      if(b.checkin) eventi.push({data:b.checkin, titolo:`Check-in: ${b.nome}`, immobile:p.nome, colore:'sage', propId:p.id, tab:'prenotazioni'});
      if(b.checkout) eventi.push({data:b.checkout, titolo:`Check-out: ${b.nome}`, immobile:p.nome, colore:'brass', propId:p.id, tab:'prenotazioni'});
    });
    (p.manutenzioni||[]).filter(m=>m.stato!=='completata').forEach(m=>{
      if(m.scadenza) eventi.push({data:m.scadenza, titolo:`Scadenza intervento: ${m.descrizione}`, immobile:p.nome, colore:'terracotta', propId:p.id, tab:'interventi'});
      if(m.dataProgrammazione) eventi.push({data:m.dataProgrammazione, titolo:`Intervento programmato: ${m.descrizione}`, immobile:p.nome, colore:'brass', propId:p.id, tab:'interventi'});
    });

}

  const eventiPerGiorno = {};

    if(!e.data) return;

  });

  let cells = '';

      <span>${day}</span>
      ${evs.length ? `<span style="width:5px;height:5px;border-radius:50%;background:${dotColor};"></span>` : ''}
    </div>`;
  }
  const weekdays = ['Lu','Ma','Me','Gi','Ve','Sa','Do'].map(w=>`<div class="cal-weekday">${w}</div>`).join('');

    </div>
  ` : '';

  const prossimi = eventi.filter(e=>e.data && e.data >= todayKey).slice(0,12);
  const listaHtml = prossimi.length ? prossimi.map(e=>`
    <div class="cal-day-detail-item" style="padding:11px 2px;border-bottom:1px solid var(--line-soft); border-radius:0;" data-goto-evento="${e.propId}::${e.tab}">

  return `

function saveControllo(propId, data, editingId){
  const p = state.properties.find(x=>x.id===propId);
  if(!p.controlli) p.controlli = [];
  const payload = { ...data, esito: calcEsitoControllo(data.checklist) };
  if(editingId){ Object.assign(p.controlli.find(x=>x.id===editingId), payload); }
  else { p.controlli.push({id:uid(), ...payload}); }
  saveData(); closeModal(); render();
}
function deleteControllo(propId, id){
  const p = state.properties.find(x=>x.id===propId);
  p.controlli = p.controlli.filter(x=>x.id!==id);
  saveData(); render();
}
function setPeriodicitaControlli(propId, mesi){
  const p = state.properties.find(x=>x.id===propId);
  p.periodicitaControlli = Math.max(1, Number(mesi)||2);
  saveData(); render();

function setPercentualeProprietario(propId, valore){
  const p = state.properties.find(x=>x.id===propId);
  let n = Number(valore);
  if(isNaN(n)) n = 100;
  n = Math.min(100, Math.max(0, n));
  p.percentualeProprietario = n;
  saveData(); render();
}

  const calcolo = calcTotale(p, data.checkin, data.checkout);

function getBookedDaysMap(prenotazioni){
  const confirmed = new Set();
  const pending = new Set();
  (prenotazioni||[]).forEach(b=>{
    if(b.stato==='rifiutata' || !b.checkin || !b.checkout) return;
    const d = new Date(b.checkin);
    const end = new Date(b.checkout);
    while(d < end){
      const key = d.toISOString().slice(0,10);
      if(b.stato==='confermata') confirmed.add(key); else pending.add(key);
      d.setDate(d.getDate()+1);
    }
  });
  return {confirmed, pending};
}

function propertyAvailableForDates(p, checkin, checkout, adulti, bambini, animali){
  if(!p.disponibilePrenotazioni) return false;
  const calcolo = calcTotale(p, checkin, checkout);
  if(!calcolo || calcolo.sottoMinimo) return false;
  const capacitaTotale = (p.capacitaAdulti||0) + (p.capacitaBambini||0);
  if(capacitaTotale>0 && ((adulti||0)+(bambini||0)) > capacitaTotale) return false;
  if((animali||0)>0 && !p.animaliAmmessi) return false;
  const {confirmed} = getBookedDaysMap(p.prenotazioni);
  for(let d=new Date(checkin); d<new Date(checkout); d.setDate(d.getDate()+1)){
    if(confirmed.has(d.toISOString().slice(0,10))) return false;
  }
  return true;
}

    <div class="cal-header">
      <button class="icon-btn" data-cal-nav="-1">‹</button>
      <div class="cal-month">${monthName}</div>
      <button class="icon-btn" data-cal-nav="1">›</button>
    </div>
    <div class="cal-grid">${weekdays}${cells}</div>
    <div class="cal-legend">
      <span><i class="dot booked"></i>Confermata</span>
      <span><i class="dot pending"></i>Richiesta in attesa</span>
    </div>
    ${dettaglioGiorno}
  </div>`;
}

function getWeekKey(date){
  const start = new Date(date.getFullYear(), 0, 1);
  const diffDays = Math.floor((date - start) / 86400000);
  const week = Math.floor(diffDays / 7) + 1;
  return `${date.getFullYear()}-W${String(week).padStart(2,'0')}`;
}
function basePriceForDate(p, date){
  const wKey = getWeekKey(date);
  const settimanali = p.prezziSettimanali || {};
  if(settimanali[wKey] !== undefined) return settimanali[wKey] / 7;
  return p.prezzoNotte || 0;
}

function calcTotale(p, checkin, checkout){
  if(!checkin || !checkout) return null;
  const start = new Date(checkin), end = new Date(checkout);
  if(!(end > start)) return null;
  const custom = p.tariffePersonalizzate || {};
  let soggiornoBase = 0, notti = 0;
  for(let d=new Date(start); d<end; d.setDate(d.getDate()+1)){
    const key = d.toISOString().slice(0,10);
    const prezzo = custom[key] !== undefined ? custom[key] : basePriceForDate(p, d);
    soggiornoBase += prezzo;
    notti++;
  }
  const servizi = (p.servizi||[]).map(s=>({
    nome: s.nome,
    importo: s.tipo==='notte' ? Number(s.costo||0)*notti : Number(s.costo||0)
  }));
  const totaleServizi = servizi.reduce((sum,s)=>sum+s.importo,0);
  const totale = soggiornoBase + totaleServizi;
  const notteMinima = p.notteMinima || 1;
  return {totale, notti, soggiornoBase, servizi, totaleServizi, sottoMinimo: notti < notteMinima, notteMinima};
}

function renderPricingCalendar(p, monthOffset){
  const base = new Date();
  const viewDate = new Date(base.getFullYear(), base.getMonth()+monthOffset, 1);
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleDateString('it-IT',{month:'long', year:'numeric'});
  const startWeekday = (new Date(year, month, 1).getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const custom = p.tariffePersonalizzate || {};

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const key = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const hasCustom = custom[key] !== undefined;
    const prezzo = hasCustom ? custom[key] : basePriceForDate(p, new Date(year, month, day));
    cells += `<div class="cal-cell cal-cell-price ${hasCustom?'custom':''}" data-price-day="${key}">
      <span class="cal-day-num">${day}</span>
      <span class="cal-day-price">${prezzo ? '€'+Math.round(prezzo) : ''}</span>
    </div>`;
  }
  const weekdays = ['Lu','Ma','Me','Gi','Ve','Sa','Do'].map(w=>`<div class="cal-weekday">${w}</div>`).join('');

  return `<div class="calendar">
    <div class="cal-header">
      <button class="icon-btn" data-price-cal-nav="-1">‹</button>
      <div class="cal-month">${monthName}</div>
      <button class="icon-btn" data-price-cal-nav="1">›</button>
    </div>
    <div class="cal-grid">${weekdays}${cells}</div>
    <div class="cal-legend"><span>Tocca un giorno per un'eccezione puntuale (evidenziati in oro). Senza eccezione, usa il prezzo della settimana o quello base.</span></div>
  </div>`;
}

function renderPrezziSettimanali(p, year){
  const prezzi = p.prezziSettimanali || {};
  let week = 1, currentMonth = -1, html = '';
  while(true){
    const weekStart = new Date(year, 0, 1 + (week-1)*7);
    if(weekStart.getFullYear() > year || week > 53) break;
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);
    const key = `${year}-W${String(week).padStart(2,'0')}`;
    const month = weekStart.getMonth();
    if(month !== currentMonth){
      currentMonth = month;
      html += `<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--brass-deep);margin:14px 0 6px 0;">${weekStart.toLocaleDateString('it-IT',{month:'long'})}</div>`;
    }
    const valore = prezzi[key] !== undefined ? prezzi[key] : '';
    html += `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap;">
      <div style="width:70px;font-size:11.5px;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;">Sett. ${week}</div>
      <div style="width:110px;font-size:11.5px;color:var(--ink-soft);">${weekStart.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})} – ${weekEnd.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})}</div>
      <input type="number" data-week-key="${key}" value="${valore}" placeholder="base: €${Math.round((p.prezzoNotte||0)*7)}" style="max-width:150px;padding:6px 10px;border:1px solid var(--line);border-radius:4px;font-size:13px;">
      <span style="font-size:11px;color:var(--ink-soft);">€ / settimana</span>
    </div>`;
    week++;
  }
  return `<div style="max-height:360px;overflow-y:auto;border:1px solid var(--line-soft);border-radius:6px;padding:10px 16px;margin-bottom:16px;">${html}</div>`;
}

function renderServizi(p, editable){

  if(!servizi.length) return `<p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 14px 0;">Nessun servizio aggiuntivo configurato.</p>`;

function getCoverPhotoUrl(p){
  if(!p.foto || !p.foto.length) return null;
  if(p.fotoCopertina){
    const cop = p.foto.find(f=>typeof f==='object' && f.id===p.fotoCopertina);
    if(cop) return cop.url;
  }
  const pubblicita = p.foto.find(f=>typeof f==='object' && f.categoria==='pubblicita');
  if(pubblicita) return pubblicita.url;
  return fotoUrl(p.foto[0]);
}
function getCoverPhotoPubblicaUrl(p){
  const pubblicita = (p.foto||[]).filter(f=>typeof f==='object' && f.categoria==='pubblicita');
  if(!pubblicita.length) return null;
  if(p.fotoCopertina){
    const cop = pubblicita.find(f=>f.id===p.fotoCopertina);
    if(cop) return cop.url;
  }
  return pubblicita[0].url;
}

    'approvata': {label:'approvata, da pagare', cls:'in-corso'},

function renderPrenotazioni(p){
  const list = [...(p.prenotazioni||[])].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  if(!list.length) return `<p style="font-size:12.5px;color:var(--ink-soft);margin:-6px 0 30px 0;">Nessuna richiesta di prenotazione ricevuta.</p>`;
  const rows = list.map(b=>`
    <div class="booking-row">
      ${stampMarkHtml('booking:'+b.id)}
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
        <div>
          <div style="font-family:'Fraunces',serif;font-weight:600;font-size:15px;">${b.nome}</div>
          <div style="font-size:12px;color:var(--ink-soft);margin:4px 0;">${fmtDate(b.checkin)} → ${fmtDate(b.checkout)} · ${b.telefono||'—'}</div>
          ${b.indirizzo ? `<div style="font-size:12px;color:var(--ink-soft);">Residenza: ${b.indirizzo}</div>` : ''}
          ${(b.adulti || b.bambini || b.animali) ? `<div style="font-size:12px;color:var(--ink-soft);">${b.adulti||1} adult${(b.adulti||1)===1?'o':'i'}${b.bambini?`, ${b.bambini} bambin${b.bambini===1?'o':'i'}`:''}${b.animali?`, ${b.animali} animal${b.animali===1?'e':'i'}`:''}</div>` : ''}
          ${b.note ? `<div style="font-size:12px;color:var(--ink-soft);">Nota: ${b.note}</div>` : ''}
          ${(b.dichiaraPagato && !b.pagamentoRicevuto) ? `<div style="font-size:11.5px;color:var(--brass-deep);font-weight:600;margin-top:4px;"><i class="ti ti-credit-card"></i> il cliente dichiara di aver pagato — verifica e conferma</div>` : ''}
          ${b.documento ? `<img class="doc-preview" src="${b.documento}">` : ''}
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">
          <span class="booking-status ${b.stato}">${b.stato}</span>
          ${b.pagamentoRicevuto ? `<span style="font-size:11px;color:var(--sage);font-weight:600;">✓ pagamento ricevuto</span>` : ''}
          ${waButton(b.telefono, `Ciao ${b.nome}, la contatto riguardo alla richiesta di prenotazione per ${p.nome}.`, 'WhatsApp')}
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
        ${b.stato==='richiesta' ? `
          <button class="icon-btn" data-confirm-booking="${b.id}">Conferma</button>
          <button class="icon-btn danger" data-reject-booking="${b.id}">Rifiuta</button>
        ` : ''}
        ${(b.stato==='confermata' && !b.pagamentoRicevuto) ? `<button class="icon-btn" data-segna-pagamento-booking="${b.id}">Segna pagamento ricevuto</button>` : ''}
      </div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);">
        <p style="font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 8px 0;">Messaggi con l'ospite ${b.nome}</p>
        ${renderBookingChat(p, b, 'gestore')}
      </div>
    </div>
  `).join('');
  return rows;
}

// ---------- Vista Gestore ----------

  const alertPortfolio = calcolaAlertPortfolio();
  const propsVisibili = immobiliVisibili();
  const items = propsVisibili.map(p=>{
    const status = propertyStatus(p);
    const color = status==='ok' ? 'var(--sage)' : status==='prog' ? 'var(--brass)' : 'var(--terracotta)';
    const alertImmobile = calcolaAlertImmobile(p);
    return `<div class="nav-item ${state.selectedId===p.id?'active':''}" data-nav="${p.id}">
      <div><div>${p.nome}${alertImmobile.totale>0?`<span class="nav-badge">${alertImmobile.totale}</span>`:''}</div><div class="code">${p.catasto}</div></div>
      <div class="badge-dot" style="background:${color}"></div>

  const clientiVisibiliIds = new Set(propsVisibili.map(p=>p.clienteId));

    const nImmobili = state.properties.filter(p=>p.clienteId===c.id).length;

  return `
    <div class="sidebar">
      <p class="brand">Portfolio Immobiliare</p>
      <p class="brand-sub">Schedario proprietà</p>
      <div class="nav-item ${state.selectedId===null && !state.selectedClienteId && state.vistaGestore!=='tutte-prenotazioni'?'active':''}" data-nav="overview"><div class="nav-item-main"><span class="nav-icon"><i class="ti ti-layout-dashboard"></i></span>Panoramica${alertPortfolio.totale>0?`<span class="nav-badge">${alertPortfolio.totale}</span>`:''}</div></div>
      ${haModulo('prenotazioni') ? `<div class="nav-item ${state.selectedId===null && !state.selectedClienteId && state.vistaGestore==='tutte-prenotazioni'?'active':''}" data-nav-prenotazioni><div class="nav-item-main"><span class="nav-icon"><i class="ti ti-calendar-event"></i></span>Tutte le prenotazioni${alertPortfolio.prenotazioniPendenti>0?`<span class="nav-badge">${alertPortfolio.prenotazioniPendenti}</span>`:''}</div></div>` : ''}
      ${haModulo('clienti') || isAdmin() ? `
        <div class="nav-section-label">Clienti (${clientiVisibili.length})</div>
        ${clientiItems || '<div style="font-size:12.5px;color:var(--ink-soft);padding:8px 12px;">Nessun cliente ancora.</div>'}
        ${isAdmin() ? `<button class="btn-new" data-action="new-cliente">+ Nuovo cliente</button>` : ''}
      ` : ''}
      <div class="nav-section-label">Immobili (${propsVisibili.length})</div>
      ${items || '<div style="font-size:12.5px;color:var(--ink-soft);padding:8px 12px;">Nessun immobile ancora.</div>'}
      ${isAdmin() ? `<button class="btn-new" data-action="new-property">+ Nuovo immobile</button>` : ''}
      ${isAdmin() ? `
        <div class="nav-section-label">Operatori (${state.operatori.length})</div>
        ${operatoriItems || '<div style="font-size:12.5px;color:var(--ink-soft);padding:8px 12px;">Nessun operatore ancora.</div>'}
        <button class="btn-new" data-action="new-operatore">+ Nuovo operatore</button>
      ` : ''}
      ${isAdmin() ? `<div class="nav-item" data-action="open-settings" style="margin-top:18px;border-top:1px solid rgba(255,255,255,0.1);padding-top:14px;"><div class="nav-item-main"><span class="nav-icon"><i class="ti ti-settings"></i></span>Impostazioni agenzia</div></div>` : ''}
      ${state.gestoreUnlocked ? `<div class="nav-item" data-action="logout-gestore" style="color:var(--terracotta);"><div class="nav-item-main"><span class="nav-icon" style="color:var(--terracotta);"><i class="ti ti-logout"></i></span>Esci</div></div>` : ''}

}

function renderClienteCRM(c){
  const immobili = state.properties.filter(p=>p.clienteId===c.id);

  const immobiliCards = immobili.map(p=>{
    const status = propertyStatus(p);
    return `<div class="prop-card" data-nav="${p.id}">
      <div class="prop-card-head">
        <div class="prop-card-main">${propertyTypeIcon(p.tipo)}<div><div class="prop-name">${p.nome}</div><div class="prop-addr">${p.indirizzo || '—'}</div></div></div>
        <span class="status-seal ${status}">${statusLabel[status]}</span>
      </div>
      <div class="prop-card-foot">
        <span class="prop-catasto">${p.catasto}</span>
        ${p.prezzoNotte ? `<span class="prop-price">€ ${p.prezzoNotte}/notte</span>` : ''}
      </div>
    </div>`;
  }).join('');

  // attività aggregate su tutti gli immobili del cliente
  let eventi = [];
  immobili.forEach(p=>{
    (p.messaggi||[]).forEach(m=>eventi.push({data:m.data, testo:`Messaggio (${m.autore==='gestore'?'a':'da'} ${c.nome}) su ${p.nome}: "${m.testo}"`}));
    (p.manutenzioni||[]).forEach(m=>(m.storico||[]).forEach(s=>eventi.push({data:s.data, testo:`${p.nome}: ${s.testo}`})));
    (p.controlli||[]).forEach(ct=>eventi.push({data:ct.data, testo:`${p.nome}: controllo periodico registrato`}));
    (p.versamentiProprietario||[]).forEach(v=>eventi.push({data:v.data, testo:`${p.nome}: versamento di ${fmtCurrency(v.importo)}`}));
    (p.prenotazioni||[]).forEach(b=>eventi.push({data:b.createdAt, testo:`${p.nome}: richiesta prenotazione da ${b.nome} (${b.stato})`}));
  });
  eventi.sort((a,b)=>new Date(b.data)-new Date(a.data));
  const eventiHtml = eventi.length ? eventi.slice(0,40).map(e=>`<div class="storico-item"><span class="storico-data">${fmtDate(e.data)}</span>${e.testo}</div>`).join('') : `<p style="font-size:12.5px;color:var(--ink-soft);">Nessuna attività registrata ancora.</p>`;

  return `
    <div class="dossier-header">
      <div>
        <p class="prop-catasto" style="margin-bottom:4px;">CLIENTE</p>
        <h1 class="page-title" style="margin-bottom:2px;">${c.nome||'(senza nome)'}</h1>
        <p class="page-sub" style="margin-bottom:0;">${c.telefono||'—'}${c.email?' · '+c.email:''}${c.indirizzo?' · '+c.indirizzo:''}</p>
      </div>
      <div class="dossier-actions">
        ${waButton(c.telefono, `Salve ${c.nome}, la contatto riguardo ai suoi immobili.`, 'WhatsApp')}
        <button class="icon-btn" data-action="edit-cliente">Modifica</button>
        <button class="icon-btn danger" data-action="delete-cliente">Elimina</button>
      </div>
    </div>

    ${(c.documenti && c.documenti.length) ? `
      <p class="section-label" style="margin-top:20px;">Documento d'identità</p>
      ${renderPhotoGallery(c.documenti)}
    ` : ''}

    <p class="section-label" style="margin-top:24px;">Immobili collegati (${immobili.length})</p>
    <div class="prop-grid">${immobiliCards}</div>
    <button class="add-inline" data-action="new-immobile-cliente">+ Aggiungi un immobile a questo cliente</button>

    <p class="section-label">Attività recente su tutti gli immobili</p>
    <div class="storico-list" style="border-top:none;padding-top:0;">${eventiHtml}</div>
  `;
}

          ${(b.adulti || b.bambini || b.animali) ? `<div style="font-size:12px;color:var(--ink-soft);">${b.adulti||1} adult${(b.adulti||1)===1?'o':'i'}${b.bambini?`, ${b.bambini} bambin${b.bambini===1?'o':'i'}`:''}${b.animali?`, ${b.animali} animal${b.animali===1?'e':'i'}`:''}</div>` : ''}

function renderOverview(){
  const props = immobiliVisibili();
  const anno = new Date().getFullYear();
  const speseAnno = props.reduce((s,p)=>s + (p.spese||[]).filter(e=>new Date(e.data).getFullYear()===anno).reduce((a,e)=>a+Number(e.importo||0),0),0);
  const manutenzioniUrgenti = props.reduce((s,p)=>s + (p.manutenzioni||[]).filter(m=>m.stato!=='completata' && daysUntil(m.scadenza)<=30).length, 0);
  const affittati = props.filter(p=>p.locazione && p.locazione.attivo);
  const canoneMensile = affittati.reduce((s,p)=>s+(Number(p.locazione.canone)||0),0);
  const contrattiInScadenza = affittati.filter(p=>daysUntil(p.locazione.scadenzaContratto)<=60).length;
  const richiestePendenti = props.reduce((s,p)=>s + (p.prenotazioni||[]).filter(b=>b.stato==='richiesta').length, 0);

  if(props.length===0){
    return `
      <h1 class="page-title">Panoramica</h1>
      <p class="page-sub">Il tuo portfolio immobiliare, in un colpo d'occhio.</p>
      <div class="empty-state">
        <div class="big">Nessun immobile registrato</div>
        <div>Aggiungi il primo immobile per iniziare a tracciare valore, spese e manutenzioni.</div>
        <br>
        <button class="btn-new" style="width:auto;padding:10px 20px;" data-action="new-property">+ Nuovo immobile</button>
      </div>
    `;
  }

  const cards = props.map(p=>{
    const status = propertyStatus(p);
    const rent = rentInfo(p);
    const rentLine = rent.rented
      ? `<div class="prop-rent ${rent.expiring?'expiring':''}">Affittato · ${fmtCurrency(p.locazione.canone)}/mese${rent.expiring?` · scade tra ${rent.giorni}gg`:''}</div>`
      : `<div class="prop-rent vacant">Libero</div>`;
    const bookableLine = p.disponibilePrenotazioni ? `<div class="prop-bookable"><i class="ti ti-circle-check-filled"></i> Prenotabile online</div>` : '';
    const copertina = getCoverPhotoUrl(p);
    return `
      <div class="prop-card" data-nav="${p.id}">
        ${copertina ? `<img class="prop-cover" src="${copertina}">` : ''}
        <div class="prop-card-head">
          <div class="prop-card-main">${propertyTypeIcon(p.tipo)}<div><div class="prop-name">${p.nome}</div><div class="prop-addr">${p.indirizzo || '—'}</div></div></div>
          <span class="status-seal ${status}">${statusLabel[status]}</span>
        </div>
        ${rentLine}
        ${bookableLine}
        <div class="prop-card-foot">
          <span class="prop-catasto">${p.catasto}</span>
          ${p.prezzoNotte ? `<span class="prop-price">€ ${p.prezzoNotte}/notte</span>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const secondRow = (affittati.length) ? `
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Canone mensile attivo</div>
        <div class="stat-value sage">${fmtCurrency(canoneMensile)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Immobili affittati</div>
        <div class="stat-value">${affittati.length} / ${props.length}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Contratti in scadenza (60gg)</div>
        <div class="stat-value ${contrattiInScadenza>0?'terracotta':''}">${contrattiInScadenza}</div>
      </div>
    </div>
  ` : '';

  const alertPortfolio = calcolaAlertPortfolio();
  const alertBanner = alertPortfolio.totale>0 ? `
    <div class="alert-banner">
      <div class="alert-banner-title"><i class="ti ti-alert-triangle"></i> ${alertPortfolio.totale} cosa${alertPortfolio.totale>1?'e':''} da controllare</div>
      ${alertPortfolio.prenotazioniPendenti>0 ? `<div class="alert-banner-item clickable" data-goto-alert="prenotazioni"><b>${alertPortfolio.prenotazioniPendenti}</b> richiest${alertPortfolio.prenotazioniPendenti>1?'e':'a'} di prenotazione da confermare o rifiutare</div>` : ''}
      ${alertPortfolio.spesePagare>0 ? `<div class="alert-banner-item clickable" data-goto-alert="spese"><b>${alertPortfolio.spesePagare}</b> spes${alertPortfolio.spesePagare>1?'e':'a'} approvat${alertPortfolio.spesePagare>1?'e':'a'} da pagare</div>` : ''}
      ${alertPortfolio.controlliRitardo>0 ? `<div class="alert-banner-item clickable" data-goto-alert="controlli"><b>${alertPortfolio.controlliRitardo}</b> immobil${alertPortfolio.controlliRitardo>1?'i':'e'} con controllo periodico in ritardo</div>` : ''}
      ${alertPortfolio.preventiviRisposti>0 ? `<div class="alert-banner-item clickable" data-goto-alert="interventi"><b>${alertPortfolio.preventiviRisposti}</b> preventiv${alertPortfolio.preventiviRisposti>1?'i':'o'} con risposta del proprietario da gestire</div>` : ''}
      ${alertPortfolio.interventiDaTriage>0 ? `<div class="alert-banner-item clickable" data-goto-alert="interventi-nuovi"><b>${alertPortfolio.interventiDaTriage}</b> nuov${alertPortfolio.interventiDaTriage>1?'i':'o'} intervent${alertPortfolio.interventiDaTriage>1?'i':'o'} da valutare</div>` : ''}
      ${alertPortfolio.messaggiProprietario>0 ? `<div class="alert-banner-item clickable" data-goto-alert="messaggi"><b>${alertPortfolio.messaggiProprietario}</b> messagg${alertPortfolio.messaggiProprietario>1?'i':'io'} dal proprietario non lett${alertPortfolio.messaggiProprietario>1?'i':'o'}</div>` : ''}
      ${alertPortfolio.messaggiOspiti>0 ? `<div class="alert-banner-item clickable" data-goto-alert="messaggi-ospiti"><b>${alertPortfolio.messaggiOspiti}</b> messagg${alertPortfolio.messaggiOspiti>1?'i':'io'} da${alertPortfolio.messaggiOspiti>1?' ospiti':' un ospite'} non lett${alertPortfolio.messaggiOspiti>1?'i':'o'}</div>` : ''}
    </div>
  ` : '';

  return `
    <h1 class="page-title">Panoramica</h1>
    <p class="page-sub">Il tuo portfolio immobiliare, in un colpo d'occhio.</p>
    ${alertBanner}
    <div class="bento-row">
      <div class="bento-tile"><div class="bento-label">Spese ${anno}</div><div class="bento-value" data-count="${speseAnno}" data-format="currency">${fmtCurrency(0)}</div></div>
      <div class="bento-tile"><div class="bento-label">Manutenzioni entro 30gg</div><div class="bento-value ${manutenzioniUrgenti>0?'terracotta':''}" data-count="${manutenzioniUrgenti}">0</div></div>
      <div class="bento-tile"><div class="bento-label">Immobili in portfolio</div><div class="bento-value" data-count="${props.length}">0</div></div>
      <div class="bento-tile"><div class="bento-label">Richieste da evadere</div><div class="bento-value ${richiestePendenti>0?'terracotta':''}" data-count="${richiestePendenti}">0</div></div>
    </div>
    ${secondRow}

    <p class="section-label">Calendario scadenze e prenotazioni</p>
    ${renderDashboardCalendar()}

    <p class="section-label" style="margin-top:32px;">Immobili</p>
    <div class="prop-grid">${cards}</div>
  `;
}

function renderControlloCard(c, p, editable){
  const stato = statoControlloLabel(c, p);
  const checklistHtml = (c.checklist && c.checklist.length) ? `
    <div style="margin:10px 0;">
      ${c.checklist.map(v=>{
        const colore = v.stato==='problema' ? 'var(--terracotta)' : v.stato==='verificare' ? 'var(--brass-deep)' : 'var(--sage)';
        const simbolo = v.stato==='problema' ? '✕' : v.stato==='verificare' ? '△' : '✓';
        let azioneIntervento = '';
        if(v.stato==='problema'){
          const interventoCollegato = v.interventoId ? (p.manutenzioni||[]).find(m=>m.id===v.interventoId) : null;
          if(interventoCollegato){
            azioneIntervento = interventoCollegato.stato==='completata'
              ? `<span style="color:var(--sage);font-size:11.5px;margin-left:8px;"><span class="seal" style="width:16px;height:16px;font-size:9px;">✓</span>intervento risolto</span>`
              : `<span class="status-pill ${interventoCollegato.stato}" style="margin-left:8px;">intervento ${interventoCollegato.stato.replace('-',' ')}</span>`;
          } else if(editable){
            azioneIntervento = `<button class="link-btn" data-crea-intervento-da-controllo="${c.id}::${encodeURIComponent(v.voce)}" style="margin-left:8px;">apri intervento</button>`;
          }
        }
        return `<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;padding:3px 0;flex-wrap:wrap;">
          <span style="color:${colore};font-weight:700;width:14px;">${simbolo}</span>
          <span>${v.voce}</span>
          ${azioneIntervento}
        </div>`;
      }).join('')}
    </div>
  ` : '';
  return `
    <div class="checkin-row">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
        <div style="flex:1;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="checkin-date">${fmtDate(c.data)}</div>
            <span class="status-pill ${stato.cls}">${stato.label}</span>
          </div>
          ${checklistHtml}
          ${c.note ? `<div style="font-size:13px;margin-top:4px;">${c.note}</div>` : ''}
          ${renderPhotoGallery(c.foto)}
        </div>
        ${editable ? `<button class="link-btn" data-del-controllo="${c.id}">rimuovi</button>` : ''}
      </div>
    </div>
  `;
}

function renderControlli(p, editable){
  const list = [...(p.controlli||[])].sort((a,b)=>new Date(b.data)-new Date(a.data));
  if(!list.length){
    return `<div class="empty-inline">Nessun controllo registrato ancora.</div>`;
  }
  const inCorso = list.filter(c=>!isControlloConcluso(c, p));
  const conclusi = list.filter(c=>isControlloConcluso(c, p));

  let html = inCorso.length
    ? inCorso.map(c=>renderControlloCard(c, p, editable)).join('')
    : `<div class="empty-inline">Nessun controllo in attesa di risoluzione — tutto verde.</div>`;

  if(conclusi.length){
    html += `
      <button class="archivio-toggle" data-toggle-controlli-conclusi>
        <span class="chev">${state.mostraControlliConclusi ? '▾' : '▸'}</span>
        <span>Controlli conclusi</span>
        <span class="count">${conclusi.length}</span>
      </button>
      ${state.mostraControlliConclusi ? `<div class="archivio-body">${conclusi.map(c=>renderControlloCard(c, p, editable)).join('')}</div>` : ''}
    `;
  }

  return html;
}

function renderImpegnoServizio(){
  const testo = state.settings.impegnoServizio;
  if(!testo || !testo.trim()) return '';
  const righe = testo.split('\n').map(r=>r.trim()).filter(Boolean);

  return `<div class="commitment-box">
    <ul>${righe.map(r=>`<li>${r}</li>`).join('')}</ul>
  </div>`;
}
function renderCaratteristicheAnnuncio(p){
  const testo = p.caratteristicheAnnuncio;
  if(!testo || !testo.trim()) return '';

  return `<div class="commitment-box">

}

function renderListinoServizi(p, editable){

        <div class="stat-row" style="margin-bottom:24px;">

  return `

        ` : ''}

    <div class="dossier-tabs">${tabsHtml}</div>
    ${tabContent}
  `;
}

function renderProprietariView(){
  if(state.ownerRecoveryMode){
    return `<div class="portal-shell" style="text-align:center;">

        <button type="submit" class="btn-primary" style="width:100%;">Salva nuova password</button>
      </form>
      </div>
    </div>`;
  }
  if(!state.ownerAuth){
    const modSignup = state.ownerAuthMode==='signup';
    return `<div class="portal-shell" style="text-align:center;">

      ${!modSignup && state.ownerResetInviato
        ? `<p style="font-size:12.5px;color:var(--sage);margin-top:16px;">Email inviata — controlla la posta e segui il link per reimpostare la password.</p>`
        : (!modSignup ? `<button class="link-btn" data-owner-recupero style="margin-top:16px;">Password dimenticata?</button><br>` : '')}

      </div>
    </div>`;
  }

  const clienteLoggato = getClienteByEmail(state.ownerAuth.email);

    state.ownerAuth = null;
